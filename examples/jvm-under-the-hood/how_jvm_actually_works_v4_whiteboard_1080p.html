          ctx.fillStyle = beat.headerBg || '#1E7A8C';
          ctx.fill();
          ctx.fillStyle = '#FFFFFF';
          ctx.font = `800 28px ${Theme.FONTS.sans}`;
          ctx.textAlign = 'center';
          ctx.fillText(beat.header || 'Record Batching', 960, 261);

          if (beat.subtitle) {
            ctx.beginPath();
            ctx.roundRect(660, 296, 600, 44, 14);
            ctx.fillStyle = '#7A6A28';
            ctx.fill();
            ctx.strokeStyle = '#FACC15';
            ctx.lineWidth = 1.6;
            ctx.setLineDash([7, 5]);
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.fillStyle = '#FFFFFF';
            ctx.font = `700 20px ${Theme.FONTS.sans}`;
            ctx.fillText(beat.subtitle, 960, 325);
          }

          ctx.beginPath();
          ctx.roundRect(440, 362, 1040, 412, 20);
          ctx.fillStyle = 'rgba(88, 52, 82, 0.42)';
          ctx.fill();
          ctx.strokeStyle = '#C084FC';
          ctx.lineWidth = 2;
          ctx.setLineDash([10, 7]);
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.restore();
        }

        if (pStack > 0.02) {
          const items = beat.stackItems || ['event 1', 'event 2', 'event 3', 'event 4'];
          ctx.save();
          ctx.globalAlpha *= pStack;
          ctx.beginPath();
          ctx.roundRect(490, 392, 310, 352, 16);
          ctx.fillStyle = '#8C7428';
          ctx.fill();
          ctx.strokeStyle = '#FACC15';
          ctx.lineWidth = 2.4;
          ctx.stroke();

          items.slice(0, 4).forEach((lbl, idx) => {
            const pi = reveal(0.7 + idx * 0.45, 5, 0.45);
            if (pi <= 0.01) return;
            const slideY = (1 - pi) * -18;
            ctx.save();
            ctx.globalAlpha *= pi;
            ctx.beginPath();
            ctx.roundRect(516, 412 + idx * 70 + slideY, 258, 54, 10);
            ctx.fillStyle = beat.pillColor || '#EF4444';
            ctx.fill();
            ctx.fillStyle = '#FFFFFF';
            ctx.font = `700 22px ${Theme.FONTS.sans}`;
            ctx.textAlign = 'center';
            ctx.fillText(lbl, 645, 447 + idx * 70 + slideY);
            ctx.restore();
          });

          ctx.fillStyle = '#FEF08A';
          ctx.font = `700 20px ${Theme.FONTS.sans}`;
          ctx.textAlign = 'center';
          ctx.fillText(beat.stackTitle || '64KB Batch', 645, 722);
          ctx.restore();
        }

        Connectors.dashedArrow(ctx, 810, 568, 1170, 568, {
          progress: pArrow,
          color: '#FFFFFF',
          lineWidth: 3.4,
          label: beat.arrowLabel || '1 single RPC',
          timeSec: t
        });

        Illustrations.wireframeCylinderDb(ctx, 1310, 555, {
          width: 175,
          height: 155,
          color: '#38BDF8',
          label: beat.dbLabel || 'Kafka Log',
          progress: pDb
        });

        const pBanner = reveal(4.1, 5, 0.55);
        if (beat.takeaway && pBanner > 0.05) {
          Theme.drawTakeawayPill(ctx, beat.takeaway, { variant: 'banner', tag: beat.tag || 'BATCHING', border: '#FACC15', alpha: pBanner });
        }
        return;
      }

      // STYLE 4 (Real ByteByteGo linux_40s.png): Two-Column Matte Comparison Cards with Sentence-Synced Bullets & Spotlight
      if (type === 'comparison-cards') {
        const left = beat.left || { title: 'Traditional', bullets: ['Slower random I/O', 'Per-message locks'] };
        const right = beat.right || { title: 'Apache Kafka', bullets: ['600+ MB/s sequential log', 'Zero broker locks'] };
        const pLeft = reveal(0, 5, 0.65);
        const pRight = reveal(2.1, 5, 0.65);
        const pBanner = reveal(4.1, 5, 0.55);
        const activeSide = activeStep(2);

        const drawPanel = (x, panel, p, headerFill, bodyFill, baseStep, isFocus) => {
          if (p <= 0.01) return;
          ctx.save();
          ctx.globalAlpha *= p;
          const w = 680;
          const h = 470;
          const y = 265;

          ctx.beginPath();
          ctx.roundRect(x, y, w, h, 22);
          ctx.fillStyle = bodyFill;
          ctx.fill();
          if (isFocus) {
            ctx.strokeStyle = '#34D399';
            ctx.lineWidth = 3;
            ctx.stroke();
          }

          ctx.beginPath();
          ctx.roundRect(x, y, w, 68, [22, 22, 0, 0]);
          ctx.fillStyle = headerFill;
          ctx.fill();

          ctx.fillStyle = '#FFFFFF';
          ctx.font = `800 28px ${Theme.FONTS.sans}`;
          ctx.textAlign = 'center';
          ctx.fillText(panel.title || '', x + w / 2, y + 44);

          ctx.textAlign = 'left';
          ctx.font = `600 25px ${Theme.FONTS.sans}`;
          (panel.bullets || []).slice(0, 5).forEach((line, idx) => {
            const pb = reveal(baseStep + 0.35 + idx * 0.42, 5, 0.48);
            if (pb <= 0.01) return;
            const slideX = (1 - pb) * -18;
            ctx.save();
            ctx.globalAlpha *= pb;
            ctx.fillStyle = '#F8FAFC';
            ctx.fillText(`-  ${line}`, x + 42 + slideX, y + 132 + idx * 72);
            ctx.restore();
          });
          ctx.restore();
        };

        drawPanel(250, left, pLeft, left.headerBg || '#6E7A3B', left.bodyBg || '#213D37', 0, activeSide === 0);
        drawPanel(990, right, pRight, right.headerBg || '#0F766E', right.bodyBg || '#19373D', 2.1, activeSide === 1);

        if (beat.takeaway && pBanner > 0.05) {
          Theme.drawTakeawayPill(ctx, beat.takeaway, { variant: 'banner', tag: beat.tag || 'COMPARISON', border: '#34D399', alpha: pBanner });
        }
        return;
      }

      // STYLE 5 (Real ByteByteGo http_10s.png): Horizontal Gold-Outline Pill Chain with Moving Focus Cursor
      if (type === 'pill-chain') {
        const pills = Array.isArray(beat.pills) && beat.pills.length ? beat.pills : ['Producer', 'LZ4 Batch', 'Partition Log', 'Consumer'];
        const count = Math.min(4, pills.length);
        const pillW = 260;
        const pillH = 82;
        const gap = 115;
        const totalW = count * pillW + (count - 1) * gap;
        const startX = (1920 - totalW) / 2;
        const cy = 500;
        const curActive = activeStep(count);

        if (beat.heroMetric) {
          const ph = reveal(0, count + 1, 0.65);
          ctx.save();
          ctx.globalAlpha *= ph;
          Effects.typeText(ctx, beat.heroMetric, 960, 320, ph, {
            font: `900 54px ${Theme.FONTS.mono}`,
            color: '#FACC15'
          });
          if (beat.heroSub) {
            ctx.fillStyle = '#CBD5E1';
            ctx.font = `600 22px ${Theme.FONTS.sans}`;
            ctx.textAlign = 'center';
            ctx.fillText(beat.heroSub, 960, 368);
          }
          ctx.restore();
        }

        pills.slice(0, count).forEach((lbl, idx) => {
          const p = reveal(idx * 0.85, count + 0.5, 0.55);
          if (p <= 0.01) return;
          const x = startX + idx * (pillW + gap);
          const isHighlight = idx === curActive || idx === count - 1;

          ctx.save();
          ctx.globalAlpha *= p;
          ctx.beginPath();
          ctx.roundRect(x, cy - pillH / 2, pillW, pillH, 26);
          ctx.fillStyle = idx === curActive ? 'rgba(16, 185, 129, 0.30)' : (idx === count - 1 ? 'rgba(16, 185, 129, 0.18)' : 'rgba(20, 24, 30, 0.92)');
          ctx.fill();
          ctx.strokeStyle = isHighlight ? '#34D399' : '#FACC15';
          ctx.lineWidth = idx === curActive ? 4 : 3;
          if (idx === curActive) {
            ctx.shadowColor = '#34D399';
            ctx.shadowBlur = 16;
          }
          ctx.stroke();
          ctx.shadowBlur = 0;

          ctx.fillStyle = '#FFFFFF';
          ctx.font = `800 26px ${Theme.FONTS.sans}`;
          ctx.textAlign = 'center';
          ctx.fillText(lbl, x + pillW / 2, cy + 9);
          ctx.restore();

          if (idx < count - 1) {
            const pa = reveal(idx * 0.85 + 0.5, count + 0.5, 0.48);
            Connectors.solidArrow(ctx, x + pillW + 4, cy, x + pillW + gap - 6, cy, {
              progress: pa,
              color: '#FFFFFF',
              lineWidth: 3.2,
              timeSec: t
            });
          }
        });

        const pBanner = reveal(count - 0.1, count + 0.5, 0.55);
        if (beat.takeaway && pBanner > 0.05) {
          Theme.drawTakeawayPill(ctx, beat.takeaway, { variant: 'pill', border: '#FACC15', alpha: pBanner });
        }
        return;
      }

      // Default: 'icon-flow' (2 or 3 large animated icon medallions connected by glowing comet streams)
      const nodes = Array.isArray(beat.nodes) && beat.nodes.length ? beat.nodes : [
        { icon: 'cpuSilicon', tag: 'SOURCE', title: 'Input Stage', color: '#38BDF8' },
        { icon: 'checkShield', tag: 'TARGET', title: 'Output Stage', color: '#34D399' }
      ];
      const count = Math.min(3, nodes.length);
      const xs = count === 2 ? [500, 1420] : [380, 960, 1540];
      const size = count === 2 ? 132 : 120;

      const curActive = activeStep(count);
      nodes.slice(0, count).forEach((node, idx) => {
        const pn = reveal(idx, count + 1, 0.58);
        Icons.drawBadge(ctx, node.icon || 'cpuSilicon', xs[idx], 455, size, {
          color: node.color || '#38BDF8',
          tag: node.tag,
          title: node.title,
          sub: node.sub,
          progress: pn,
          timeSec: t
        });
        if (idx === curActive && pn > 0.7) {
          Effects.sonarPulse(ctx, xs[idx], 455, t, { color: node.color || '#38BDF8', maxRadius: size + 24, rings: 1 });
        }
        if (node.crossOut && pn > 0.7) {
          Effects.crossOutFailure(ctx, xs[idx], 455, (pn - 0.7) / 0.3, { size: 92 });
        }
        if (idx < count - 1) {
          const pa = reveal(idx + 0.55, count + 1, 0.52);
          const lbl = Array.isArray(beat.arrowLabels) ? beat.arrowLabels[idx] : (beat.arrowLabel || '');
          const col = Array.isArray(beat.arrowColors) ? beat.arrowColors[idx] : (beat.arrowColor || node.color || '#34D399');
          Connectors.flowArrow(ctx, xs[idx] + size + 16, 455, xs[idx + 1] - size - 16, 455, t, {
            progress: pa,
            color: col,
            lineWidth: 3.2,
            label: lbl,
            orbs: 3
          });
        }
      });

      const pBanner = reveal(count, count + 1, 0.55);
      if (beat.takeaway && pBanner > 0.05) {
        Theme.drawTakeawayPill(ctx, beat.takeaway, {
          variant: beat.takeawayVariant || 'banner',
          tag: beat.tag || 'KEY INSIGHT',
          border: beat.border || '#34D399',
          alpha: pBanner
        });
      }
    }

    const compiledScenes = (BLUEPRINT.scenes || []).map((sc, scIdx) => {
      const beats = Array.isArray(sc.beats) ? sc.beats : [];
      let cursor = 0;
      const timedBeats = beats.map((b) => {
        const dur = b.duration || 10;
        const entry = { ...b, startSec: cursor, endSec: cursor + dur };
        cursor += dur;
        return entry;
      });
      const totalSceneDur = cursor || sc.duration || 20;

      // Persistent Multi-Beat Whiteboard Scene: actors stay on canvas across all beats with zero full-screen wipes!
      let persistentWbSpec = null;
      if (sc.whiteboard && Whiteboard) {
        const mergedActions = Array.isArray(sc.whiteboard.actions) ? sc.whiteboard.actions.slice() : [];
        timedBeats.forEach((b) => {
          const bDur = Math.max(1, b.endSec - b.startSec);
          if (Array.isArray(b.actions)) {
            b.actions.forEach((act) => {
              const mapped = { ...act };
              if (mapped.at != null) {
                mapped.at = Number((b.startSec + mapped.at).toFixed(3));
              } else if (mapped.p != null) {
                mapped.at = Number((b.startSec + mapped.p * bDur).toFixed(3));
                delete mapped.p;
              } else {
                mapped.at = Number(b.startSec.toFixed(3));
              }
              if (mapped.until != null) {
                mapped.until = Number((b.startSec + mapped.until).toFixed(3));
              } else if (mapped.pUntil != null) {
                mapped.until = Number((b.startSec + mapped.pUntil * bDur).toFixed(3));
                delete mapped.pUntil;
              }
              if (mapped.pDur != null) {
                mapped.dur = Number((mapped.pDur * bDur).toFixed(3));
                delete mapped.pDur;
              }
              mergedActions.push(mapped);
            });
          }
        });
        persistentWbSpec = {
          ...sc.whiteboard,
          actions: mergedActions
        };
      }

      // Auto-emit crisp soft micro-pop/tick cues synced to each beat's progressive reveals (zero white-noise whoosh)
      const autoSfx = [];
      if (persistentWbSpec && Whiteboard) {
        autoSfx.push(...Whiteboard.extractSfxCues(persistentWbSpec, 0, totalSceneDur));
      } else {
        timedBeats.forEach((b) => {
          const dur = Math.max(2, b.endSec - b.startSec);
          if (b.type === 'whiteboard' && Whiteboard) {
            autoSfx.push(...Whiteboard.extractSfxCues(b, b.startSec, dur));
          } else {
            autoSfx.push({ time: Number((b.startSec + 0.14).toFixed(2)), type: 'pop' });
            if (dur >= 5) {
              autoSfx.push({ time: Number((b.startSec + dur * 0.34).toFixed(2)), type: 'tick' });
            }
            if (dur >= 8) {
              autoSfx.push({ time: Number((b.startSec + dur * 0.64).toFixed(2)), type: 'tick' });
            }
          }
        });
      }

      return {
        id: sc.id || `scene-${scIdx + 1}`,
        chapter: sc.chapter || `0${scIdx + 1}. Section ${scIdx + 1}`,
        duration: totalSceneDur,
        qaTime: Math.min(totalSceneDur - 1, 4.5),
        backdrop: sc.backdrop || 'dotMatrix',
        transition: sc.transition || 'fade',
        sfx: autoSfx,
        captions: timedBeats
          .filter((b) => b.narration && b.narration.trim())
          .map((b) => ({
            start: Number((b.startSec + 0.1).toFixed(2)),
            end: Number((b.endSec - 0.15).toFixed(2)),
            text: b.narration.trim()
          })),
        render(ctx, { localT, t }) {
          if (persistentWbSpec && Whiteboard) {
            // Find currently active beat for screen-space header / takeaway overlay
            const activeBeat = timedBeats.find((b) => localT >= b.startSec && localT < b.endSec) || timedBeats[timedBeats.length - 1];
            Whiteboard.renderScene(ctx, persistentWbSpec, localT, totalSceneDur, { drawHeader: false });
            if (activeBeat && activeBeat.title) {
              const beatLocalT = Math.max(0, localT - activeBeat.startSec);
              const beatRemain = Math.max(0, activeBeat.endSec - localT);
              const headerAlpha = Math.min(1, beatLocalT / 0.3, beatRemain < 0.25 && activeBeat !== timedBeats[timedBeats.length - 1] ? beatRemain / 0.25 : 1);
              Theme.drawBeatHeader(ctx, activeBeat.title, activeBeat.subtitle || '', {
                alpha: Math.max(0, headerAlpha),
                accent: activeBeat.accent || '#38BDF8'
              });
            }
            if (activeBeat && activeBeat.takeaway) {
              const beatLocalT = Math.max(0, localT - activeBeat.startSec);
              const beatSpan = Math.max(1, activeBeat.endSec - activeBeat.startSec);
              const pTake = Math.max(0, Math.min(1, (beatLocalT - beatSpan * 0.55) / 0.45));
              if (pTake > 0.05) {
                Theme.drawTakeawayPill(ctx, activeBeat.takeaway, {
                  variant: 'pill',
                  border: activeBeat.accent || '#34D399',
                  alpha: pTake
                });
              }
            }
            return;
          }
          timedBeats.forEach((b, bIdx) => {
            Theme.withBeat(ctx, localT, b.startSec, b.endSec, (helpers) => {
              renderBeatBody(ctx, b, helpers, t);
            }, { noFadeOut: bIdx === timedBeats.length - 1 });
          });
        }
      };
    });

    createVideo({
      title: BLUEPRINT.title || 'Technical Architecture Explainer',
      palette: BLUEPRINT.palette || 'byteByteGoTrue',
      fps: BLUEPRINT.fps || 30,
      persona: BLUEPRINT.persona || 'senior-sa',
      showCaptions: false,
      scenes: compiledScenes
    });
  </script>
</body>
