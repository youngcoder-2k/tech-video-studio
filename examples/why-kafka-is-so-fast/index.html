<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Why Apache Kafka Is So Fast — ByteByteGo Single-Focus Edition</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #262626; width: 1920px; height: 1080px; overflow: hidden; }
    #canvas { display: block; width: 1920px; height: 1080px; }
  </style>
  <script src="../../dist/tech-video-studio.bundle.js"></script>
</head>
<body>
  <canvas id="canvas" width="1920" height="1080"></canvas>
  <script>
    const { Theme, Connectors, Icons, Illustrations, createVideo } = window.TechVideoStudio;

    createVideo({
      title: 'Why Apache Kafka Is So Insanely Fast',
      palette: 'byteCharcoal',
      fps: 30,
      showCaptions: false,
      scenes: [
        // ====================================================================
        // SCENE 1: Sequential Disk Race (Beat A) -> Immutable Commit Log Tape (Beat B)
        // ====================================================================
        {
          id: 'sequential-io-and-commit-log',
          chapter: '01. Sequential Disk I/O & Immutable Append-Only Commit Log',
          duration: 30,
          qaTime: 6.0,
          backdrop: 'dotMatrix',
          transition: 'fade',
          sfx: [],
          captions: [
            {
              start: 0.3,
              end: 14.3,
              text: 'Why can Apache Kafka stream over one million messages per second on ordinary disks? The secret is replacing random disk seeks with sequential writes.'
            },
            {
              start: 14.9,
              end: 29.0,
              text: 'Every partition is an immutable, append-only commit log. New events always append right at the end of the file in O(1) time.'
            }
          ],
          render(ctx, { localT }) {
            // BEAT 1A (0s -> 14.6s): Single Centered Random I/O vs Sequential I/O Race
            Theme.withBeat(ctx, localT, 0, 14.6, ({ progress }) => {
              Illustrations.horizontalLaneRace(ctx, 260, 230, 1400, 560, {
                progress,
                topLane: {
                  tag: 'RANDOM DISK I/O (Traditional B-Tree / Queue Updates)',
                  desc: 'Disk head jumps across scattered sectors for every message update',
                  latency: '~100 KB/s (SLOW) ❌',
                  color: '#EF4444',
                  bg: 'rgba(127, 29, 29, 0.22)'
                },
                bottomLane: {
                  tag: 'SEQUENTIAL APPEND-ONLY LOG I/O (Apache Kafka Segment)',
                  desc: 'Streams contiguous byte blocks straight to the end of the file',
                  latency: '600+ MB/s (6,000x) ✔',
                  color: '#10B981',
                  bg: 'rgba(6, 78, 59, 0.24)'
                }
              });

              // Top Lane Scattered Seek Blocks
              const badSectors = ['Sector #912', 'Seek -> #041', 'Seek -> #778', 'Seek -> #105'];
              badSectors.forEach((s, i) => {
                const bx = 300 + i * 320;
                ctx.beginPath();
                ctx.roundRect(bx, 332, 260, 82, 10);
                ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
                ctx.fill();
                ctx.strokeStyle = '#EF4444';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.fillStyle = '#FCA5A5';
                ctx.font = `700 18px ${Theme.FONTS.mono}`;
                ctx.textAlign = 'center';
                ctx.fillText(s, bx + 130, 380);
              });

              // Bottom Lane Contiguous Streaming Bar
              ctx.beginPath();
              ctx.roundRect(300, 642, 1320 * Math.min(1, progress * 1.15), 82, 10);
              ctx.fillStyle = 'rgba(16, 185, 129, 0.32)';
              ctx.fill();
              ctx.strokeStyle = '#34D399';
              ctx.lineWidth = 2.5;
              ctx.stroke();

              ctx.fillStyle = '#FFFFFF';
              ctx.font = `700 19px ${Theme.FONTS.mono}`;
              ctx.textAlign = 'center';
              ctx.fillText('⚡ CONTIGUOUS STREAM WRITE -> 600+ MB/s SEQUENTIAL THROUGHPUT', 960, 690);

              Theme.drawTakeawayPill(ctx, 'Sequential Disk Writes Are Up to 6,000x Faster Than Random Disk Seeks', {
                variant: 'banner',
                tag: 'SEQUENTIAL I/O',
                border: '#34D399'
              });
            });

            // BEAT 1B (14.6s -> 30.0s): Single Centered Immutable Commit Log Tape
            Theme.withBeat(ctx, localT, 14.6, 30.0, ({ progress }) => {
              Illustrations.byteArrayTape(ctx, 220, 325, 1480, 115, {
                title: 'Partition Segment File (00000000000000000000.log) — Immutable Offset Tape',
                progress,
                cells: [
                  { label: 'Offset #0', sub: 'Committed', color: '#38BDF8', bg: 'rgba(56, 189, 248, 0.18)', span: 1 },
                  { label: 'Offset #1', sub: 'Committed', color: '#38BDF8', bg: 'rgba(56, 189, 248, 0.18)', span: 1 },
                  { label: 'Offset #2', sub: 'Committed', color: '#38BDF8', bg: 'rgba(56, 189, 248, 0.18)', span: 1 },
                  { label: 'Offset #3', sub: 'Committed', color: '#38BDF8', bg: 'rgba(56, 189, 248, 0.18)', span: 1 },
                  { label: 'Offset #4', sub: 'Committed', color: '#38BDF8', bg: 'rgba(56, 189, 248, 0.18)', span: 1 },
                  { label: 'Offset #5 ⚡', sub: 'APPEND HEAD', color: '#FACC15', bg: 'rgba(250, 204, 21, 0.28)', span: 1.3 },
                  { label: 'Next Free Blocks', sub: 'Sequential Tail', color: '#34D399', bg: 'rgba(52, 211, 153, 0.12)', span: 1.5, dashed: true }
                ],
                brackets: [
                  { startRatio: 0.0, endRatio: 0.64, label: 'Immutable Historical Events (Never Modified In-Place)', color: '#38BDF8' },
                  { startRatio: 0.64, endRatio: 1.0, label: 'O(1) Sequential Write Head', color: '#FACC15' }
                ]
              });

              const cards = [
                { title: 'O(1) Append Complexity', sub: 'Independent of total disk data size', color: '#FACC15', x: 240 },
                { title: 'Zero In-Place Mutation', sub: 'No B-Tree page splits or locks', color: '#38BDF8', x: 750 },
                { title: 'Deterministic Replay', sub: 'Consumers rewind by offset anytime', color: '#34D399', x: 1260 }
              ];

              cards.forEach((c) => {
                ctx.beginPath();
                ctx.roundRect(c.x, 535, 420, 135, 14);
                ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
                ctx.fill();
                ctx.strokeStyle = c.color;
                ctx.lineWidth = 2.2;
                ctx.stroke();

                ctx.fillStyle = '#FFFFFF';
                ctx.font = `700 22px ${Theme.FONTS.sans}`;
                ctx.textAlign = 'center';
                ctx.fillText(c.title, c.x + 210, 590);

                ctx.fillStyle = c.color;
                ctx.font = `600 15.5px ${Theme.FONTS.mono}`;
                ctx.fillText(c.sub, c.x + 210, 632);
              });

              Theme.drawTakeawayPill(ctx, 'Append-Only Commit Logs Guarantee O(1) Writes Regardless of Dataset Size', {
                variant: 'banner',
                tag: 'COMMIT LOG',
                border: '#FACC15'
              });
            }, { noFadeOut: true });
          }
        },

        // ====================================================================
        // SCENE 2: OS PageCache Pyramid (Beat A) -> mmap Sparse Index (Beat B)
        // ====================================================================
        {
          id: 'pagecache-and-mmap-index',
          chapter: '02. OS PageCache Architecture & Memory-Mapped Sparse Index',
          duration: 30,
          qaTime: 6.0,
          backdrop: 'spotlight',
          transition: 'fade',
          sfx: [],
          captions: [
            {
              start: 0.3,
              end: 14.3,
              text: 'Instead of caching messages inside the Java heap, Kafka delegates caching directly to the Linux page cache — avoiding garbage collection pauses completely.'
            },
            {
              start: 14.9,
              end: 29.0,
              text: 'To locate any offset, Kafka uses a memory-mapped sparse index. A quick binary search jumps straight to the exact byte position on disk.'
            }
          ],
          render(ctx, { localT }) {
            // BEAT 2A (0s -> 14.6s): Single Centered OS PageCache Hierarchy Pyramid
            Theme.withBeat(ctx, localT, 0, 14.6, ({ progress }) => {
              ctx.fillStyle = '#94A3B8';
              ctx.font = `700 17px ${Theme.FONTS.mono}`;
              ctx.textAlign = 'center';
              ctx.fillText('KAFKA MEMORY ARCHITECTURE // OS KERNEL PAGECACHE FIRST', 960, 185);

              Illustrations.memoryHierarchyPyramid(ctx, 960, 505, {
                width: 720,
                height: 500,
                activeBadge: 'KAFKA ZONE',
                progress,
                tiers: [
                  { name: 'Small JVM Heap (6–8 GB Only)', latency: 'Metadata Only • Zero GC Pause Storms', color: '#38BDF8', fill: 'rgba(56, 189, 248, 0.18)', active: false },
                  { name: 'Linux Kernel PageCache (56+ GB RAM)', latency: 'Hot Segments Served at 100 ns ⚡', color: '#34D399', fill: 'rgba(16, 185, 129, 0.36)', active: true },
                  { name: 'Memory-Mapped Index (mmap .index)', latency: 'Virtual Address Backed by Kernel RAM', color: '#FACC15', fill: 'rgba(250, 204, 21, 0.20)', active: false },
                  { name: 'Sequential Disk Log (.log Segments)', latency: 'Asynchronous Background pdflush', color: '#C084FC', fill: 'rgba(192, 132, 252, 0.18)', active: false }
                ]
              });

              Theme.drawTakeawayPill(ctx, 'OS PageCache Serves Hot Messages from Free RAM With Zero JVM GC Overhead', {
                variant: 'banner',
                tag: 'OS PAGECACHE',
                border: '#34D399'
              });
            });

            // BEAT 2B (14.6s -> 30.0s): Single Centered Memory-Mapped Sparse Index Lookup
            Theme.withBeat(ctx, localT, 14.6, 30.0, ({ progress }) => {
              ctx.fillStyle = '#FACC15';
              ctx.font = `800 20px ${Theme.FONTS.mono}`;
              ctx.textAlign = 'center';
              ctx.fillText('SPARSE OFFSET INDEX (000000.index via mmap) // O(log N) BINARY SEARCH', 960, 215);

              Illustrations.bTreeHierarchy(ctx, 960, 285, {
                root: ['Offset 1000 -> Pos 0B', 'Offset 5000 -> Pos 64KB'],
                children: [
                  { keys: ['#1000 -> 0B', '#2000 -> 16KB'], active: false },
                  { keys: ['#3000 -> 32KB', '#4000 -> 48KB ⚡'], active: true },
                  { keys: ['#5000 -> 64KB', '#6000 -> 80KB'], active: false }
                ],
                spacing: 380,
                progress
              });

              // Direct Physical Byte Offset Target Card Below
              ctx.beginPath();
              ctx.roundRect(410, 610, 1100, 140, 16);
              ctx.fillStyle = 'rgba(15, 23, 42, 0.92)';
              ctx.fill();
              ctx.strokeStyle = '#34D399';
              ctx.lineWidth = 2.4;
              ctx.stroke();

              ctx.fillStyle = '#FFFFFF';
              ctx.font = `700 24px ${Theme.FONTS.sans}`;
              ctx.textAlign = 'center';
              ctx.fillText('mmap() Sparse Index Maps Logical Offset #4000 -> Physical Byte 49,152', 960, 668);

              ctx.fillStyle = '#6EE7B7';
              ctx.font = `600 17px ${Theme.FONTS.mono}`;
              ctx.fillText('✔ Zero Full-File Scans   •   ✔ 8-Byte Compact Index Entries   •   ✔ Instant Offset Seek', 960, 712);

              Theme.drawTakeawayPill(ctx, 'Memory-Mapped Sparse Indexes Resolve Any Message Offset in Microseconds', {
                variant: 'pill',
                border: '#FACC15',
                bg: 'rgba(161, 98, 7, 0.28)'
              });
            }, { noFadeOut: true });
          }
        },

        // ====================================================================
        // SCENE 3: Traditional 4-Copy Path (Beat A) -> Zero-Copy DMA Pipeline (Beat B)
        // ====================================================================
        {
          id: 'zero-copy-sendfile-dma',
          chapter: '03. Traditional 4-Copy Bottleneck vs Linux sendfile() Zero-Copy',
          duration: 30,
          qaTime: 22.0,
          backdrop: 'splitHorizontal',
          transition: 'fade',
          sfx: [],
          captions: [
            {
              start: 0.3,
              end: 14.3,
              text: 'Normally, sending a file over the network copies data four times across user space and kernel space, wasting massive CPU cycles.'
            },
            {
              start: 14.9,
              end: 29.0,
              text: 'Kafka uses the Linux sendfile() system call for zero-copy streaming. Data moves straight from page cache to the network card via DMA.'
            }
          ],
          render(ctx, { localT, t }) {
            // BEAT 3A (0s -> 14.6s): Single Centered Traditional 4-Copy / 4-Context-Switch Chain
            Theme.withBeat(ctx, localT, 0, 14.6, ({ progress }) => {
              ctx.fillStyle = '#F87171';
              ctx.font = `800 20px ${Theme.FONTS.mono}`;
              ctx.textAlign = 'center';
              ctx.fillText('TRADITIONAL read() + write() // 4 DATA COPIES & 4 CONTEXT SWITCHES', 960, 215);

              const boxes = [
                { title: '1. Disk (.log)', sub: 'Hardware Storage', color: '#94A3B8', x: 150 },
                { title: '2. Kernel Buffer', sub: 'Read PageCache', color: '#F87171', x: 560 },
                { title: '3. User JVM Heap', sub: '❌ CPU Copy #2', color: '#EF4444', x: 970 },
                { title: '4. Socket + NIC', sub: '❌ CPU Copy #3 & #4', color: '#F87171', x: 1380 }
              ];

              boxes.forEach((b, i) => {
                ctx.beginPath();
                ctx.roundRect(b.x, 320, 340, 210, 16);
                ctx.fillStyle = i === 2 ? 'rgba(153, 27, 27, 0.38)' : 'rgba(15, 23, 42, 0.9)';
                ctx.fill();
                ctx.strokeStyle = b.color;
                ctx.lineWidth = 2.4;
                ctx.stroke();

                ctx.fillStyle = '#FFFFFF';
                ctx.font = `700 23px ${Theme.FONTS.sans}`;
                ctx.textAlign = 'center';
                ctx.fillText(b.title, b.x + 170, 415);

                ctx.fillStyle = b.color;
                ctx.font = `600 16.5px ${Theme.FONTS.mono}`;
                ctx.fillText(b.sub, b.x + 170, 460);

                if (i < 3) {
                  Connectors.solidArrow(ctx, b.x + 345, 425, boxes[i + 1].x - 5, 425, {
                    progress,
                    color: '#EF4444',
                    lineWidth: 2.8,
                    label: `Copy #${i + 1}`
                  });
                }
              });

              // Bottleneck Warning Summary Box
              ctx.beginPath();
              ctx.roundRect(430, 600, 1060, 120, 14);
              ctx.fillStyle = 'rgba(127, 29, 29, 0.30)';
              ctx.fill();
              ctx.strokeStyle = '#EF4444';
              ctx.lineWidth = 2.2;
              ctx.stroke();

              ctx.fillStyle = '#FCA5A5';
              ctx.font = `700 22px ${Theme.FONTS.mono}`;
              ctx.textAlign = 'center';
              ctx.fillText('⛔ Redundant Kernel <-> User-Space Copies Saturate CPU Cores', 960, 670);

              Theme.drawTakeawayPill(ctx, 'Traditional Socket I/O Copies Every Byte 4 Times Across Kernel and User Space', {
                variant: 'banner',
                tag: '4-COPY BOTTLENECK',
                border: '#EF4444'
              });
            });

            // BEAT 3B (14.6s -> 30.0s): Single Centered Linux sendfile() Zero-Copy DMA Pipeline
            Theme.withBeat(ctx, localT, 14.6, 30.0, ({ progress }) => {
              Illustrations.zeroCopyDmaPipeline(ctx, 220, 210, 1480, 560, {
                progress,
                timeSec: t
              });

              Theme.drawTakeawayPill(ctx, 'Linux sendfile() + DMA Streams PageCache Directly to the NIC With Zero CPU Copies', {
                variant: 'banner',
                tag: 'ZERO-COPY DMA',
                border: '#34D399'
              });
            }, { noFadeOut: true });
          }
        },

        // ====================================================================
        // SCENE 4: Producer Batching (Beat A) -> End-to-End LZ4 Compression (Beat B)
        // ====================================================================
        {
          id: 'producer-batching-and-compression',
          chapter: '04. Producer RecordAccumulator Batching & End-to-End LZ4/Zstd',
          duration: 30,
          qaTime: 6.0,
          backdrop: 'isometric',
          transition: 'fade',
          sfx: [],
          captions: [
            {
              start: 0.3,
              end: 14.3,
              text: 'On the producer side, Kafka never sends messages one by one. It buffers events in memory and flushes them as one contiguous batch.'
            },
            {
              start: 14.9,
              end: 29.0,
              text: 'Each batch is compressed with LZ4 or Zstd before leaving the producer, and stays compressed on broker disk until the consumer reads it.'
            }
          ],
          render(ctx, { localT }) {
            // BEAT 4A (0s -> 14.6s): Single Centered RecordAccumulator Batching Pipeline
            Theme.withBeat(ctx, localT, 0, 14.6, ({ progress }) => {
              ctx.fillStyle = '#38BDF8';
              ctx.font = `800 20px ${Theme.FONTS.mono}`;
              ctx.textAlign = 'center';
              ctx.fillText('PRODUCER RECORDACCUMULATOR // AMORTIZING NETWORK & DISK I/O', 960, 215);

              // Left: Producer Batch Queue
              Illustrations.pubSubTopicBox(ctx, 210, 390, 620, 150, {
                title: 'RecordAccumulator (linger.ms = 5, batch.size = 64KB)',
                tint: 'teal',
                offsets: ['Msg #1', 'Msg #2', 'Msg #3', 'Msg #4', '64KB FULL'],
                activeSlot: 4,
                progress
              });

              // Center Arrow
              Connectors.solidArrow(ctx, 845, 465, 1085, 465, {
                progress,
                color: '#34D399',
                lineWidth: 3.2,
                label: '1 Single RPC'
              });

              // Right: Broker Contiguous Write
              ctx.beginPath();
              ctx.roundRect(1100, 345, 610, 240, 18);
              ctx.fillStyle = 'rgba(6, 78, 59, 0.32)';
              ctx.fill();
              ctx.strokeStyle = '#34D399';
              ctx.lineWidth = 2.6;
              ctx.stroke();

              Icons.draw(ctx, 'kafkaLogo', 1220, 465, 105, { glowColor: '#34D399' });

              ctx.fillStyle = '#FFFFFF';
              ctx.font = `700 25px ${Theme.FONTS.sans}`;
              ctx.textAlign = 'left';
              ctx.fillText('Single Broker Sequential Write', 1310, 425);

              ctx.fillStyle = '#6EE7B7';
              ctx.font = `600 17.5px ${Theme.FONTS.mono}`;
              ctx.fillText('✔ 1,000x Fewer Network Round-Trips', 1310, 475);
              ctx.fillText('✔ 1 Contiguous OS PageCache Append', 1310, 515);
              ctx.fillText('✔ 1M+ Events/sec Throughput', 1310, 555);

              Theme.drawTakeawayPill(ctx, 'Record Batching Amortizes Network Round-Trips and Disk Writes Across Thousands of Events', {
                variant: 'banner',
                tag: 'BATCHING ENGINE',
                border: '#38BDF8'
              });
            });

            // BEAT 4B (14.6s -> 30.0s): Single Centered End-to-End Compressed Batch Frame
            Theme.withBeat(ctx, localT, 14.6, 30.0, ({ progress }) => {
              ctx.fillStyle = '#FACC15';
              ctx.font = `800 20px ${Theme.FONTS.mono}`;
              ctx.textAlign = 'center';
              ctx.fillText('END-TO-END RECORD BATCH FRAME // COMPRESSED ONCE, STORED COMPRESSED', 960, 245);

              Illustrations.networkPacketFrame(ctx, 220, 330, 1480, 130, {
                progress,
                segments: [
                  { label: 'Base Offset & Length', sub: '12 Bytes', ratio: 0.22, border: '#38BDF8', bg: 'rgba(2, 132, 199, 0.28)' },
                  { label: 'CRC32-C & Magic', sub: 'Integrity Check', ratio: 0.20, border: '#FACC15', bg: 'rgba(161, 98, 7, 0.28)' },
                  { label: 'Attributes (LZ4 / Zstd)', sub: 'Codec Bitmask', ratio: 0.20, border: '#C084FC', bg: 'rgba(107, 33, 168, 0.28)' },
                  { label: 'Compressed Records Payload (5x Smaller)', sub: 'Zero Broker Re-Compression ⚡', ratio: 0.38, border: '#34D399', bg: 'rgba(6, 78, 59, 0.38)' }
                ]
              });

              const stages = [
                { title: '1. Producer Compresses', sub: 'LZ4 / Zstd batch compression', color: '#38BDF8', x: 230 },
                { title: '2. Broker Stores Raw Bytes', sub: 'Zero CPU decompression on broker', color: '#FACC15', x: 750 },
                { title: '3. Consumer Decompresses', sub: '80% less network & disk bandwidth', color: '#34D399', x: 1270 }
              ];

              stages.forEach((s) => {
                ctx.beginPath();
                ctx.roundRect(s.x, 545, 420, 135, 14);
                ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
                ctx.fill();
                ctx.strokeStyle = s.color;
                ctx.lineWidth = 2.2;
                ctx.stroke();

                ctx.fillStyle = '#FFFFFF';
                ctx.font = `700 22px ${Theme.FONTS.sans}`;
                ctx.textAlign = 'center';
                ctx.fillText(s.title, s.x + 210, 600);

                ctx.fillStyle = s.color;
                ctx.font = `600 15.5px ${Theme.FONTS.mono}`;
                ctx.fillText(s.sub, s.x + 210, 642);
              });

              Theme.drawTakeawayPill(ctx, 'End-to-End LZ4/Zstd Batch Compression Cuts Network and Disk Footprint by 80%', {
                variant: 'banner',
                tag: '5x COMPRESSION',
                border: '#34D399'
              });
            }, { noFadeOut: true });
          }
        },

        // ====================================================================
        // SCENE 5: Partition Parallelism (Beat A) -> ISR Quorum Mesh (Beat B)
        // ====================================================================
        {
          id: 'partition-parallelism-and-isr',
          chapter: '05. Horizontal Partition Parallelism & In-Sync Replica Quorum',
          duration: 30,
          qaTime: 6.0,
          backdrop: 'blueprint',
          transition: 'fade',
          sfx: [],
          captions: [
            {
              start: 0.3,
              end: 14.3,
              text: 'To scale horizontally, a topic splits into independent partitions across brokers. Consumers read from multiple partitions in parallel with zero lock contention.'
            },
            {
              start: 14.9,
              end: 29.0,
              text: 'For fault tolerance, follower brokers replicate sequentially from the leader. Once in-sync replicas confirm the write, the message is marked committed.'
            }
          ],
          render(ctx, { localT, t }) {
            // BEAT 5A (0s -> 14.6s): Single Centered Parallel Partition-to-Consumer Mesh
            Theme.withBeat(ctx, localT, 0, 14.6, ({ progress }) => {
              ctx.fillStyle = '#38BDF8';
              ctx.font = `800 19px ${Theme.FONTS.mono}`;
              ctx.textAlign = 'center';
              ctx.fillText('HORIZONTAL SCALE // PARALLEL PARTITIONS & CONSUMER GROUP LOCK-FREE READS', 960, 195);

              Illustrations.partitionConsumerMesh(ctx, 220, 235, 1480, 520, {
                progress,
                timeSec: t
              });

              Theme.drawTakeawayPill(ctx, 'Independent Topic Partitions Enable Linear Horizontal Scaling Across Brokers and Consumers', {
                variant: 'pill',
                border: '#38BDF8'
              });
            });

            // BEAT 5B (14.6s -> 30.0s): Single Centered In-Sync Replica (ISR) Quorum Triangle
            Theme.withBeat(ctx, localT, 14.6, 30.0, ({ progress }) => {
              ctx.fillStyle = '#FACC15';
              ctx.font = `800 19px ${Theme.FONTS.mono}`;
              ctx.textAlign = 'center';
              ctx.fillText('IN-SYNC REPLICA (ISR) QUORUM // HIGH-WATERMARK COMMIT WITHOUT DISK FSYNC LOCKS', 960, 195);

              Illustrations.quorumTriangleMesh(ctx, 960, 425, {
                radius: 180,
                progress,
                timeSec: t,
                nodes: [
                  { name: 'Broker 1 (Leader)', role: 'LEO = #9,420 ★', color: '#FACC15', angle: -90 },
                  { name: 'Broker 2 (ISR Follower)', role: 'Fetch #9,420 ✔', color: '#34D399', angle: 30 },
                  { name: 'Broker 3 (ISR Follower)', role: 'Fetch #9,420 ✔', color: '#38BDF8', angle: 150 }
                ]
              });

              ctx.beginPath();
              ctx.roundRect(420, 645, 1080, 110, 14);
              ctx.fillStyle = 'rgba(6, 78, 59, 0.32)';
              ctx.fill();
              ctx.strokeStyle = '#34D399';
              ctx.lineWidth = 2.4;
              ctx.stroke();

              ctx.fillStyle = '#FFFFFF';
              ctx.font = `700 22px ${Theme.FONTS.sans}`;
              ctx.textAlign = 'center';
              ctx.fillText('High Watermark (HW = #9,420) Advances Once All In-Sync Replicas Fetch into PageCache', 960, 694);

              ctx.fillStyle = '#6EE7B7';
              ctx.font = `600 16px ${Theme.FONTS.mono}`;
              ctx.fillText('acks=all + min.insync.replicas=2 Guarantees Zero Data Loss on Broker Crash', 960, 730);

              Theme.drawTakeawayPill(ctx, 'In-Sync Replica Pulling Combines Multi-Node Durability With Memory-Speed Writes', {
                variant: 'pill',
                border: '#34D399'
              });
            }, { noFadeOut: true });
          }
        },

        // ====================================================================
        // SCENE 6: Memory Replication vs fsync (Beat A) -> Architect Scorecard (Beat B)
        // ====================================================================
