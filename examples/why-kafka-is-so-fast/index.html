<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Why Apache Kafka Is So Fast — Kinetic ByteByteGo Edition (v2.6)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #262626; width: 1920px; height: 1080px; overflow: hidden; }
    #canvas { display: block; width: 1920px; height: 1080px; }
  </style>
  <script src="../../dist/tech-video-studio.bundle.js"></script>
</head>
<body>
  <canvas id="canvas" width="1920" height="1080"></canvas>
  <script>
    const { Theme, Effects, Connectors, Icons, Illustrations, createVideo } = window.TechVideoStudio;

    createVideo({
      title: 'Why Apache Kafka Is So Insanely Fast',
      palette: 'byteCharcoal',
      fps: 30,
      showCaptions: false,
      scenes: [
        // ====================================================================
        // SCENE 1 (0s - 20s): Random vs Sequential Disk (Beat A) -> Commit Log (Beat B)
        // ====================================================================
        {
          id: 'sequential-io-and-commit-log',
          chapter: '01. Sequential Disk I/O & Append-Only Commit Log',
          duration: 20,
          qaTime: 4.5,
          backdrop: 'dotMatrix',
          transition: 'fade',
          sfx: [],
          captions: [
            {
              start: 0.1,
              end: 9.8,
              text: 'Why can Apache Kafka stream over one million messages per second on ordinary disks? The secret is replacing random disk seeks with sequential writes.'
            },
            {
              start: 10.1,
              end: 19.8,
              text: 'Every partition is an immutable, append-only commit log. New events always stream straight to the end of the file in O(1) time.'
            }
          ],
          render(ctx, { localT, t }) {
            // BEAT 1A (0s -> 10.0s): Random Disk Seek vs Sequential Stream Speedometer Battle
            Theme.withBeat(ctx, localT, 0, 10.0, ({ stagger, countUp }) => {
              const pLeft = stagger(0, 0.45, 0.7);
              const pCenter = stagger(1, 0.5, 0.7);
              const pRight = stagger(2, 0.55, 0.75);
              const pBanner = stagger(3, 0.6, 0.6);

              // Left Hero: Random Disk Seeks (Slow)
              Icons.drawBadge(ctx, 'hardDiskPlatter', 460, 430, 130, {
                color: '#EF4444',
                tag: 'RANDOM DISK SEEK ❌',
                title: 'Scattered Sector Jumps',
                sub: `${countUp(100, 1.5, 0.2)} KB/s Throughput`,
                progress: pLeft,
                timeSec: t
              });

              // Center VS Speedup Rocket
              if (pCenter > 0.05) {
                ctx.save();
                ctx.globalAlpha *= pCenter;
                Effects.sonarPulse(ctx, 960, 430, t, { color: '#FACC15', minRadius: 35, maxRadius: 115 });
                Icons.draw(ctx, 'rocketBoost', 960, 410, 96, { glowColor: '#FACC15', timeSec: t });
                ctx.fillStyle = '#FEF08A';
                ctx.font = `900 30px ${Theme.FONTS.mono}`;
                ctx.textAlign = 'center';
                ctx.fillText(`${countUp(6000, 1.8, 0.6)}x FASTER`, 960, 515);
                ctx.restore();
              }

              // Right Hero: Sequential Append Stream (600+ MB/s Gauge)
              if (pRight > 0.05) {
                ctx.save();
                ctx.globalAlpha *= pRight;
                Effects.sonarPulse(ctx, 1460, 420, t, { color: '#34D399', minRadius: 55, maxRadius: 150 });
                Effects.liveGaugeArc(ctx, 1460, 425, 118, pRight, {
                  color: '#34D399',
                  valueRatio: 0.94,
                  label: `${countUp(600, 1.8, 0.8)} MB/s`,
                  sub: 'Sequential Stream Write ✔'
                });
                ctx.restore();
              }

              if (pBanner > 0.05) {
                Theme.drawTakeawayPill(ctx, 'Sequential Disk Writes Are 6,000x Faster Than Random Disk Seeks', {
                  variant: 'banner',
                  tag: '6,000x SPEEDUP',
                  border: '#34D399',
                  alpha: pBanner
                });
              }
            });

            // BEAT 1B (10.0s -> 20.0s): Animated Append-Only Commit Log Stream
            Theme.withBeat(ctx, localT, 10.0, 20.0, ({ stagger }) => {
              const pProd = stagger(0, 0.4, 0.65);
              const pTape = stagger(1, 0.5, 0.75);
              const pBanner = stagger(2, 0.65, 0.6);

              // Left Producer Icon Medallion
              Icons.drawBadge(ctx, 'lightningBolt', 350, 470, 115, {
                color: '#FACC15',
                tag: 'PRODUCER STREAM',
                title: 'Incoming Events',
                sub: '1M+ msgs/sec',
                progress: pProd,
                timeSec: t
              });

              // High-velocity capsule stream flying into Commit Log Tail
              if (pTape > 0.2) {
                Connectors.flowArrow(ctx, 460, 470, 660, 470, t, {
                  color: '#FACC15',
                  lineWidth: 3,
                  label: 'O(1) Append',
                  orbs: 3
                });
                Effects.dataStreamParticles(ctx, 470, 470, 650, 470, t, { color: '#FACC15', count: 3, speed: 1.4 });
              }

              // Clean 5-Cell Commit Log Tape on Right
              Illustrations.byteArrayTape(ctx, 680, 415, 1020, 110, {
                title: 'Immutable Partition Log (000000.log)',
                progress: pTape,
                cells: [
                  { label: 'Offset #0', sub: 'Locked', color: '#38BDF8', bg: 'rgba(56, 189, 248, 0.18)', span: 1 },
                  { label: 'Offset #1', sub: 'Locked', color: '#38BDF8', bg: 'rgba(56, 189, 248, 0.18)', span: 1 },
                  { label: 'Offset #2', sub: 'Locked', color: '#38BDF8', bg: 'rgba(56, 189, 248, 0.18)', span: 1 },
                  { label: 'Offset #3 ⚡', sub: 'WRITE HEAD', color: '#FACC15', bg: 'rgba(250, 204, 21, 0.30)', span: 1.3 },
                  { label: 'Free Tail', sub: 'Next Offset ->', color: '#34D399', bg: 'rgba(52, 211, 153, 0.14)', span: 1.2, dashed: true }
                ]
              });

              if (pBanner > 0.05) {
                Theme.drawTakeawayPill(ctx, 'Append-Only Commit Logs Guarantee O(1) Writes Regardless of Dataset Size', {
                  variant: 'banner',
                  tag: 'O(1) APPEND',
                  border: '#FACC15',
                  alpha: pBanner
                });
              }
            }, { noFadeOut: true });
          }
        },

        // ====================================================================
        // SCENE 2 (20s - 40s): OS PageCache RAM (Beat A) -> mmap Sparse Index (Beat B)
        // ====================================================================
        {
          id: 'pagecache-and-mmap-index',
          chapter: '02. Linux Kernel PageCache & Memory-Mapped Sparse Index',
          duration: 20,
          qaTime: 4.5,
          backdrop: 'spotlight',
          transition: 'fade',
          sfx: [],
          captions: [
            {
              start: 0.1,
              end: 9.8,
              text: 'Instead of caching messages inside the Java heap, Kafka delegates caching directly to the Linux page cache — avoiding garbage collection pauses completely.'
            },
            {
              start: 10.1,
              end: 19.8,
              text: 'To locate any offset, Kafka uses a memory-mapped sparse index. A quick binary search jumps straight to the exact byte position on disk.'
            }
          ],
          render(ctx, { localT, t }) {
            // BEAT 2A (0s -> 10.0s): JVM Heap Trap vs Linux Kernel PageCache Hero
            Theme.withBeat(ctx, localT, 0, 10.0, ({ stagger, countUp }) => {
              const p1 = stagger(0, 0.45, 0.65);
              const p2 = stagger(1, 0.55, 0.7);
              const p3 = stagger(2, 0.65, 0.6);

              // Left: Bloated JVM Heap (Crossed out warning)
              Icons.drawBadge(ctx, 'javaLogo', 520, 440, 125, {
                color: '#EF4444',
                tag: '64GB JVM HEAP ❌',
                title: 'Stop-The-World GC Pauses',
                sub: '2x Object Memory Overhead',
                progress: p1,
                timeSec: t
              });
              if (p1 > 0.7) {
                Effects.crossOutFailure(ctx, 520, 440, (p1 - 0.7) / 0.3, { size: 95 });
              }

              // Center Arrow
              Connectors.flowArrow(ctx, 680, 440, 1180, 440, t, {
                progress: p2,
                color: '#34D399',
                lineWidth: 3.2,
                label: 'Offload to Linux Kernel RAM',
                orbs: 3
              });

              // Right: Linux Kernel PageCache RAM Chip Hero
              Icons.drawBadge(ctx, 'ramChip', 1360, 440, 135, {
                color: '#34D399',
                tag: 'LINUX PAGECACHE ✔',
                title: `${countUp(58, 1.5, 0.5)} GB Free Kernel RAM`,
                sub: '100 ns Hot Read • Zero GC Freeze',
                progress: p2,
                timeSec: t
              });

              if (p3 > 0.05) {
                Theme.drawTakeawayPill(ctx, 'OS PageCache Serves Hot Messages from Free RAM With Zero JVM GC Overhead', {
                  variant: 'banner',
                  tag: 'OS PAGECACHE',
                  border: '#34D399',
                  alpha: p3
                });
              }
            });

            // BEAT 2B (10.0s -> 20.0s): mmap() Sparse Index Binary Search Lens -> Disk Byte Position
            Theme.withBeat(ctx, localT, 10.0, 20.0, ({ stagger, countUp }) => {
              const p1 = stagger(0, 0.4, 0.65);
              const p2 = stagger(1, 0.5, 0.7);
              const p3 = stagger(2, 0.6, 0.65);

              // Left: Memory-Mapped Sparse Index with Magnifying Glass
              Icons.drawBadge(ctx, 'magnifyingGlass', 420, 450, 120, {
                color: '#FACC15',
                tag: 'MMAP .INDEX (RAM)',
                title: 'O(log N) Binary Search',
                sub: 'Offset #4000 -> Byte 49,152',
                progress: p1,
                timeSec: t
              });

              // Center Laser Pointer Jump
              if (p2 > 0.1) {
                Connectors.laserBeam(ctx, 570, 450, 1160, 450, t, {
                  progress: p2,
                  color: '#FACC15',
                  label: 'Direct Physical Offset Jump (0 Scans)'
                });
                Effects.dataStreamParticles(ctx, 570, 450, 1160, 450, t, { color: '#38BDF8', count: 3, speed: 1.5 });
              }

              // Right: Target Disk Segment Block
              Icons.drawBadge(ctx, 'hardDiskPlatter', 1360, 450, 125, {
                color: '#38BDF8',
                tag: 'SEGMENT .LOG FILE',
                title: `Byte Pos #${countUp(49152, 1.4, 0.5)}`,
                sub: 'Instant O(1) Sequential Slice',
                progress: p2,
                timeSec: t
              });

              if (p3 > 0.05) {
                Theme.drawTakeawayPill(ctx, 'Memory-Mapped Sparse Indexes Resolve Any Message Offset in Microseconds', {
                  variant: 'pill',
                  border: '#FACC15',
                  alpha: p3
                });
              }
            }, { noFadeOut: true });
          }
        },

        // ====================================================================
        // SCENE 3 (40s - 60s): 4-Copy Bottleneck (Beat A) -> Zero-Copy DMA (Beat B)
        // ====================================================================
        {
          id: 'zero-copy-sendfile-dma',
          chapter: '03. Traditional 4-Copy Trap vs Linux sendfile() Zero-Copy',
          duration: 20,
          qaTime: 14.5,
          backdrop: 'splitHorizontal',
          transition: 'fade',
          sfx: [],
          captions: [
            {
              start: 0.1,
              end: 9.8,
              text: 'Normally, sending a file over the network copies data four times across user space and kernel space, burning massive CPU cycles.'
            },
            {
              start: 10.1,
              end: 19.8,
              text: 'Kafka uses the Linux sendfile() system call for zero-copy streaming. Data moves straight from page cache to the network card via DMA.'
            }
          ],
          render(ctx, { localT, t }) {
            // BEAT 3A (0s -> 10.0s): Clean 3-Node Traditional CPU Bottleneck (Disk -> User JVM -> NIC)
            Theme.withBeat(ctx, localT, 0, 10.0, ({ stagger, countUp }) => {
              const p1 = stagger(0, 0.35, 0.6);
              const p2 = stagger(1, 0.45, 0.65);
              const p3 = stagger(2, 0.55, 0.65);
              const p4 = stagger(3, 0.65, 0.6);

              Icons.drawBadge(ctx, 'hardDiskPlatter', 380, 450, 115, {
                color: '#94A3B8',
                tag: '1. KERNEL READ',
                title: 'Disk + PageCache',
                sub: 'Context Switch #1 & #2',
                progress: p1,
                timeSec: t
              });

              Connectors.flowArrow(ctx, 515, 450, 795, 450, t, {
                progress: p2,
                color: '#EF4444',
                lineWidth: 3,
                label: 'CPU Copy into User Space'
              });

              Icons.drawBadge(ctx, 'cpuSilicon', 960, 450, 130, {
                color: '#EF4444',
                tag: '2. USER JVM BUFFER ❌',
                title: `${countUp(4, 1.2, 0.4)} Redundant Copies`,
                sub: '100% CPU Core Saturation',
                progress: p2,
                timeSec: t
              });

              Connectors.flowArrow(ctx, 1125, 450, 1405, 450, t, {
                progress: p3,
                color: '#EF4444',
                lineWidth: 3,
                label: 'CPU Copy Back to Kernel'
              });

              Icons.drawBadge(ctx, 'networkCardNic', 1540, 450, 115, {
                color: '#F87171',
                tag: '3. SOCKET & NIC',
                title: 'Network Buffer',
                sub: 'Context Switch #3 & #4',
                progress: p3,
                timeSec: t
              });

              if (p4 > 0.05) {
                Theme.drawTakeawayPill(ctx, 'Traditional Socket I/O Copies Every Byte 4 Times Across Kernel and User Space', {
                  variant: 'banner',
                  tag: '4 CPU COPIES',
                  border: '#EF4444',
                  alpha: p4
                });
              }
            });

            // BEAT 3B (10.0s -> 20.0s): Linux sendfile() Zero-Copy DMA Direct Highway
            Theme.withBeat(ctx, localT, 10.0, 20.0, ({ stagger }) => {
              const p1 = stagger(0, 0.35, 0.65);
              const p2 = stagger(1, 0.5, 0.7);
              const p3 = stagger(2, 0.65, 0.6);

              // Top Faded Bypassed User Space Pill
              if (p1 > 0.1) {
                ctx.save();
                ctx.globalAlpha *= p1 * 0.75;
                ctx.beginPath();
                ctx.roundRect(560, 195, 800, 64, 32);
                ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
                ctx.fill();
                ctx.strokeStyle = '#34D399';
                ctx.lineWidth = 2;
                ctx.setLineDash([8, 6]);
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.fillStyle = '#6EE7B7';
                ctx.font = `800 18px ${Theme.FONTS.mono}`;
                ctx.textAlign = 'center';
                ctx.fillText('▲ USER-SPACE JVM BYPASSED — ZERO CPU DATA COPIES ✔', 960, 234);
                ctx.restore();
              }

              // Left: Linux PageCache RAM
              Icons.drawBadge(ctx, 'ramChip', 480, 500, 135, {
                color: '#FACC15',
                tag: 'KERNEL PAGECACHE',
                title: 'OS RAM Buffer',
                sub: 'sendfile() Syscall',
                progress: p1,
                timeSec: t
              });

              // Center High-Speed DMA Laser Highway
              if (p2 > 0.05) {
                Connectors.flowArrow(ctx, 645, 500, 1275, 500, t, {
                  progress: p2,
                  color: '#34D399',
                  lineWidth: 4,
                  label: 'Direct Memory Access (DMA Engine — 0 CPU Cycles)',
                  orbs: 4,
                  speed: 1.6
                });
                Effects.dataStreamParticles(ctx, 660, 500, 1260, 500, t, { color: '#34D399', count: 5, speed: 1.5 });
              }

              // Right: 10GbE Network Card NIC
              Icons.drawBadge(ctx, 'networkCardNic', 1440, 500, 135, {
                color: '#34D399',
                tag: 'NIC TX BUFFER ✔',
                title: '10+ Gbps Wire Speed',
                sub: 'Direct Hardware Transfer',
                progress: p2,
                timeSec: t
              });

              if (p3 > 0.05) {
                Theme.drawTakeawayPill(ctx, 'Linux sendfile() + DMA Streams PageCache Directly to the NIC With Zero CPU Copies', {
                  variant: 'banner',
                  tag: 'ZERO-COPY DMA',
                  border: '#34D399',
                  alpha: p3
                });
              }
            }, { noFadeOut: true });
          }
        },

        // ====================================================================
        // SCENE 4 (60s - 80s): Producer Batching (Beat A) -> LZ4 Compression (Beat B)
        // ====================================================================
        {
          id: 'producer-batching-and-compression',
          chapter: '04. Producer Record Batching & End-to-End LZ4 Compression',
          duration: 20,
          qaTime: 4.5,
          backdrop: 'isometric',
          transition: 'fade',
          sfx: [],
          captions: [
            {
              start: 0.1,
              end: 9.8,
              text: 'On the producer side, Kafka never sends messages one by one. It buffers events in memory and flushes them as one contiguous batch.'
            },
            {
              start: 10.1,
              end: 19.8,
              text: 'Each batch is compressed with LZ4 or Zstd before leaving the producer, and stays compressed on broker disk until the consumer reads it.'
            }
          ],
          render(ctx, { localT, t }) {
            // BEAT 4A (0s -> 10.0s): RecordAccumulator Batch Queue -> Single Kafka Broker Write
            Theme.withBeat(ctx, localT, 0, 10.0, ({ stagger, countUp }) => {
              const p1 = stagger(0, 0.4, 0.65);
              const p2 = stagger(1, 0.5, 0.7);
              const p3 = stagger(2, 0.6, 0.6);

              // Left: Animated Batching Buffer
              Illustrations.pubSubTopicBox(ctx, 220, 400, 620, 150, {
                title: 'Producer RecordAccumulator (64KB Batch)',
                tint: 'teal',
                offsets: ['Msg #1', 'Msg #2', 'Msg #3', 'Msg #4', 'BATCH READY ⚡'],
                activeSlot: 4,
                progress: p1
              });

              // Center High-Speed Batch RPC Stream
              if (p2 > 0.05) {
                Connectors.flowArrow(ctx, 860, 475, 1240, 475, t, {
                  progress: p2,
                  color: '#34D399',
                  lineWidth: 3.6,
                  label: '1 Single Batch RPC (1,000x Fewer Round-Trips)',
                  orbs: 3
                });
                Effects.dataStreamParticles(ctx, 870, 475, 1230, 475, t, { color: '#38BDF8', count: 3, speed: 1.3 });
              }

              // Right: Kafka Broker Medallion
              Icons.drawBadge(ctx, 'kafkaLogo', 1430, 475, 135, {
                color: '#34D399',
                tag: 'KAFKA BROKER ✔',
                title: `${countUp(1000, 1.5, 0.5)}K+ Events/sec`,
                sub: '1 Contiguous Disk Append',
                progress: p2,
                timeSec: t
              });

              if (p3 > 0.05) {
                Theme.drawTakeawayPill(ctx, 'Record Batching Amortizes Network Round-Trips Across Thousands of Events', {
                  variant: 'banner',
                  tag: '64KB BATCHING',
                  border: '#38BDF8',
                  alpha: p3
                });
              }
            });

            // BEAT 4B (10.0s -> 20.0s): End-to-End LZ4 / Zstd Compression Pipeline
            Theme.withBeat(ctx, localT, 10.0, 20.0, ({ stagger, countUp }) => {
              const p1 = stagger(0, 0.35, 0.6);
              const p2 = stagger(1, 0.45, 0.65);
              const p3 = stagger(2, 0.55, 0.65);
              const p4 = stagger(3, 0.65, 0.6);

              Icons.drawBadge(ctx, 'boxArchive', 380, 460, 120, {
                color: '#C084FC',
                tag: '1. PRODUCER LZ4',
                title: 'Compress Batch Once',
                sub: `${countUp(80, 1.4, 0.3)}% Smaller Payload`,
                progress: p1,
                timeSec: t
              });

              Connectors.flowArrow(ctx, 520, 460, 810, 460, t, {
                progress: p2,
                color: '#C084FC',
                lineWidth: 3.2,
                label: 'Compressed Wire Frame'
              });

              Icons.drawBadge(ctx, 'hardDiskPlatter', 960, 460, 125, {
                color: '#FACC15',
                tag: '2. BROKER DISK',
                title: 'Stored Compressed',
                sub: '0% Broker CPU Re-Compression',
                progress: p2,
                timeSec: t
              });

              Connectors.flowArrow(ctx, 1110, 460, 1400, 460, t, {
                progress: p3,
                color: '#34D399',
                lineWidth: 3.2,
                label: 'Zero-Copy Fetch'
              });

              Icons.drawBadge(ctx, 'checkShield', 1540, 460, 120, {
                color: '#34D399',
                tag: '3. CONSUMER',
                title: 'Decompress on Read',
                sub: '5x Higher Network Bandwidth',
                progress: p3,
                timeSec: t
              });

              if (p4 > 0.05) {
                Theme.drawTakeawayPill(ctx, 'End-to-End LZ4/Zstd Batch Compression Cuts Network and Disk Footprint by 80%', {
                  variant: 'banner',
                  tag: '5x COMPRESSION',
                  border: '#34D399',
                  alpha: p4
                });
              }
            }, { noFadeOut: true });
          }
        },

        // ====================================================================
        // SCENE 5 (80s - 100s): Partition Parallelism (Beat A) -> ISR Quorum (Beat B)
        // ====================================================================
        {
          id: 'partition-parallelism-and-isr',
          chapter: '05. Horizontal Partition Parallelism & In-Sync Replica Quorum',
          duration: 20,
          qaTime: 4.5,
          backdrop: 'blueprint',
          transition: 'fade',
          sfx: [],
          captions: [
            {
              start: 0.1,
              end: 9.8,
              text: 'To scale horizontally, a topic splits into independent partitions across brokers. Consumers read from multiple partitions in parallel with zero lock contention.'
            },
            {
              start: 10.1,
              end: 19.8,
              text: 'For fault tolerance, follower brokers replicate sequentially from the leader. Once in-sync replicas confirm the write, the message is marked committed.'
            }
          ],
          render(ctx, { localT, t }) {
            // BEAT 5A (0s -> 10.0s): Parallel Partition-to-Consumer Stream Mesh
            Theme.withBeat(ctx, localT, 0, 10.0, ({ stagger }) => {
              const pMesh = stagger(0, 0.35, 0.8);
              const pBanner = stagger(1, 0.65, 0.6);

              Illustrations.partitionConsumerMesh(ctx, 220, 225, 1480, 530, {
                progress: pMesh,
                timeSec: t
              });

              if (pBanner > 0.05) {
                Theme.drawTakeawayPill(ctx, 'Independent Topic Partitions Enable Linear Horizontal Scaling Across Brokers', {
                  variant: 'pill',
                  border: '#38BDF8',
                  alpha: pBanner
                });
              }
            });

            // BEAT 5B (10.0s -> 20.0s): In-Sync Replica (ISR) Quorum Triangle Mesh
            Theme.withBeat(ctx, localT, 10.0, 20.0, ({ stagger }) => {
              const pTri = stagger(0, 0.35, 0.75);
              const pBanner = stagger(1, 0.65, 0.6);

              Effects.sonarPulse(ctx, 960, 465, t, { color: '#FACC15', minRadius: 45, maxRadius: 195 });

              Illustrations.quorumTriangleMesh(ctx, 960, 470, {
                radius: 215,
                progress: pTri,
                timeSec: t,
                nodes: [
                  { name: 'Broker 1 (Leader)', role: 'Offset #9,420 ★', color: '#FACC15', angle: -90 },
                  { name: 'Broker 2 (ISR)', role: 'RAM Synced ✔', color: '#34D399', angle: 30 },
                  { name: 'Broker 3 (ISR)', role: 'RAM Synced ✔', color: '#38BDF8', angle: 150 }
                ]
              });

              if (pBanner > 0.05) {
                Theme.drawTakeawayPill(ctx, 'In-Sync Replica Pulling Combines Multi-Node Durability With Memory-Speed Writes', {
                  variant: 'pill',
                  border: '#34D399',
                  alpha: pBanner
                });
              }
            }, { noFadeOut: true });
          }
        },

        // ====================================================================
        // SCENE 6 (100s - 120s): Memory Durability vs fsync (Beat A) -> Scorecard (Beat B)
        // ====================================================================
        {
          id: 'replication-durability-and-scorecard',
          chapter: '06. Multi-Broker Memory Durability & Production Golden Rules',
          duration: 20,
          qaTime: 14.5,
          backdrop: 'waves',
          transition: 'fade',
          sfx: [],
          captions: [
            {
              start: 0.1,
              end: 9.8,
              text: 'Kafka rarely blocks on synchronous disk fsync. Instead, durability comes from replicating each batch into the memory of multiple independent brokers.'
            },
            {
              start: 10.1,
              end: 19.8,
              text: 'In production, tune linger.ms for healthy batching, use LZ4 compression, and keep the Java heap small so free RAM powers the page cache.'
            }
          ],
          render(ctx, { localT, t }) {
            // BEAT 6A (0s -> 10.0s): Single-Disk Sync fsync Stall vs 3-Broker RAM Replication
            Theme.withBeat(ctx, localT, 0, 10.0, ({ stagger, countUp }) => {
              const p1 = stagger(0, 0.4, 0.65);
              const p2 = stagger(1, 0.5, 0.7);
              const p3 = stagger(2, 0.65, 0.6);

              // Left: Synchronous Disk fsync Warning
              Icons.drawBadge(ctx, 'warningAlert', 480, 445, 125, {
                color: '#EF4444',
                tag: 'SYNC DISK FSYNC ❌',
                title: 'Blocks on Every Write',
                sub: `${countUp(12, 1.2, 0.3)}.0 ms Disk Flush Stall`,
                progress: p1,
                timeSec: t
              });

              // Center VS Rocket
              if (p2 > 0.05) {
                Connectors.flowArrow(ctx, 650, 445, 1230, 445, t, {
                  progress: p2,
                  color: '#34D399',
                  lineWidth: 3.5,
                  label: '10x Faster Multi-Node RAM ACK (acks=all)',
                  orbs: 3
                });
              }

              // Right: 3-Broker Memory Replication Shield
              Icons.drawBadge(ctx, 'shieldGuard', 1420, 445, 130, {
                color: '#34D399',
                tag: '3-BROKER RAM ISR ✔',
                title: '1.2 ms Memory Commit',
                sub: 'Survives Node Crash + Async Flush',
                progress: p2,
                timeSec: t
              });

              if (p3 > 0.05) {
                Theme.drawTakeawayPill(ctx, 'Multi-Broker RAM Replication Beats Synchronous fsync in Both Speed and Safety', {
                  variant: 'banner',
                  tag: '10x LOWER LATENCY',
                  border: '#34D399',
                  alpha: p3
                });
              }
            });

            // BEAT 6B (10.0s -> 20.0s): 2x2 Production Kafka Architect Scorecard
            Theme.withBeat(ctx, localT, 10.0, 20.0, ({ stagger }) => {
              const pCard = stagger(0, 0.35, 0.85);
              const pBanner = stagger(1, 0.65, 0.6);

              Illustrations.scorecardMatrix(ctx, 360, 230, 1200, 580, {
                progress: pCard,
                items: [
                  {
                    type: 'dont',
                    title: 'Unbatched Single-Message Writes',
                    cmd: '❌ linger.ms=0 & compression=none',
                    desc: 'Floods brokers with tiny RPCs and saturates disk IOPS',
                    color: '#F87171'
                  },
                  {
                    type: 'do',
                    title: 'Smart Producer Batching & LZ4',
                    cmd: '✔ linger.ms=5..10 & compression=lz4',
                    desc: 'Coalesces events into compressed 64KB sequential blocks',
                    color: '#34D399'
                  },
                  {
                    type: 'dont',
                    title: 'Oversized 64GB JVM Heap',
                    cmd: '❌ -Xmx56G (Starves OS PageCache)',
                    desc: 'Triggers long JVM GC pauses and steals RAM from kernel cache',
                    color: '#F87171'
                  },
                  {
                    type: 'do',
                    title: 'Lean 6GB Heap + Huge OS PageCache',
                    cmd: '✔ -Xmx6G + 58GB Linux PageCache',
                    desc: 'Keeps 90% of server RAM dedicated to zero-copy sendfile()',
                    color: '#38BDF8'
                  }
                ]
              });

              if (pBanner > 0.05) {
                Theme.drawTakeawayPill(ctx, 'Batch With LZ4 and Keep JVM Heap Lean So Free RAM Fuels Zero-Copy PageCache', {
                  variant: 'terminal',
                  alpha: pBanner
                });
              }
            }, { noFadeOut: true });
          }
        }
      ]
    });
