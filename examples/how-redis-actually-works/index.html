<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>How Redis Actually Works Under the Hood — ByteByteGo Multi-Style Deep Dive</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #262626; width: 1920px; height: 1080px; overflow: hidden; }
    #canvas { display: block; width: 1920px; height: 1080px; }
  </style>
  <script src="../../dist/tech-video-studio.bundle.js"></script>
</head>
<body>
  <canvas id="canvas" width="1920" height="1080"></canvas>
  <script>
    const { Theme, Camera, Connectors, Icons, Illustrations, createVideo } = window.TechVideoStudio;

    createVideo({
      title: 'How Redis Actually Works Under the Hood',
      palette: 'byteCharcoal',
      fps: 30,
      showCaptions: false,
      scenes: [
        // ====================================================================
        // SCENE 1 [STYLE A: 3D Memory Pyramid + Contiguous Byte-Array Tape]
        // Backdrop: dotMatrix
        // ====================================================================
        {
          id: 'in-memory-and-sds',
          chapter: '01. Hardware Latency Pyramid & Simple Dynamic Strings (SDS)',
          duration: 30,
          qaTime: 16.0,
          backdrop: 'dotMatrix',
          transition: 'slideLeft',
          sfx: [],
          captions: [
            { start: 0.5, end: 13.5, text: 'Redis achieves extreme speed by keeping all working datasets directly in DRAM, where memory access takes just one hundred nanoseconds compared to ten thousand nanoseconds on fast NVMe disks.' },
            { start: 14.5, end: 27.5, text: 'Under the hood, Redis replaces standard C null-terminated strings with Simple Dynamic Strings, storing pre-computed lengths for instant O of 1 lookups and binary-safe buffers.' }
          ],
          initialState: () => ({
            pyramid: 0,
            tape: 0,
            compare: 0
          }),
          build(tl, s) {
            tl.to(s, { pyramid: 1, duration: 0.9, ease: 'power2.out' }, 0.2)
              .to(s, { tape: 1, duration: 0.9, ease: 'power2.out' }, 1.0)
              .to(s, { compare: 1, duration: 0.8, ease: 'back.out(1.4)' }, 2.0);
            Camera.zoomTo(tl, s, { x: 1340, y: 520, zoom: 1.18, duration: 1.4 }, 18.0);
            Camera.reset(tl, s, 26.5, 1.0);
          },
          render(ctx, { state }) {
            // Left: 3D Hardware Latency Hierarchy Pyramid (No wrapper box!)
            ctx.save();
            ctx.fillStyle = '#94A3B8';
            ctx.font = `700 15px ${Theme.FONTS.mono}`;
            ctx.textAlign = 'center';
            ctx.fillText('HARDWARE STORAGE HIERARCHY (LOGARITHMIC LATENCY)', 470, 185);
            ctx.restore();

            Illustrations.memoryHierarchyPyramid(ctx, 490, 480, {
              width: 500,
              height: 480,
              progress: state.pyramid
            });

            // Right Top: Contiguous Byte-Array Memory Strip (SDS Layout)
            Illustrations.byteArrayTape(ctx, 880, 275, 920, 92, {
              title: 'SDS Contiguous Memory Tape (struct sdshdr32)',
              progress: state.tape,
              brackets: [
                { startRatio: 0.0, endRatio: 0.37, label: '9-Byte Metadata Header', color: '#FACC15' },
                { startRatio: 0.37, endRatio: 0.82, label: 'Binary-Safe Payload', color: '#38BDF8' },
                { startRatio: 0.82, endRatio: 1.0, label: 'Free Buffer', color: '#4ADE80' }
              ]
            });

            // Right Bottom: Side-by-Side C String vs Redis SDS Comparison Nodes
            if (state.compare > 0.05) {
              ctx.save();
              ctx.globalAlpha *= state.compare;

              // Legacy C String Box
              ctx.beginPath();
              ctx.roundRect(880, 430, 440, 290, 14);
              ctx.fillStyle = 'rgba(127, 29, 29, 0.22)';
              ctx.fill();
              ctx.strokeStyle = '#EF4444';
              ctx.lineWidth = 2;
              ctx.stroke();

              ctx.fillStyle = '#FCA5A5';
              ctx.font = `800 16px ${Theme.FONTS.mono}`;
              ctx.textAlign = 'left';
              ctx.fillText('❌ Standard C String (char*)', 908, 472);

              const cPoints = [
                '• Scans until \\0 null byte -> O(N) strlen()',
                '• Truncates binary data containing \\0 bytes',
                '• Reallocates memory on every append',
                '• Vulnerable to buffer overflow attacks'
              ];
              cPoints.forEach((pt, i) => {
                ctx.fillStyle = '#E2E8F0';
                ctx.font = `500 15px ${Theme.FONTS.sans}`;
                ctx.fillText(pt, 908, 522 + i * 44);
              });

              // Redis SDS Box
              ctx.beginPath();
              ctx.roundRect(1360, 430, 440, 290, 14);
              ctx.fillStyle = 'rgba(6, 78, 59, 0.28)';
              ctx.fill();
              ctx.strokeStyle = '#34D399';
              ctx.lineWidth = 2.2;
              ctx.stroke();

              ctx.fillStyle = '#6EE7B7';
              ctx.font = `800 16px ${Theme.FONTS.mono}`;
              ctx.fillText('✔ Redis SDS (Simple Dynamic String)', 1388, 472);

              const sdsPoints = [
                '• Reads len field directly -> O(1) strlen()',
                '• 100% Binary-Safe (Images, Protobuf, Audio)',
                '• Pre-allocates free capacity (Zero realloc)',
                '• Single contiguous CPU cache-line allocation'
              ];
              sdsPoints.forEach((pt, i) => {
                ctx.fillStyle = '#FFFFFF';
                ctx.font = `500 15px ${Theme.FONTS.sans}`;
                ctx.fillText(pt, 1388, 522 + i * 44);
              });

              ctx.restore();
            }

            if (state.compare > 0.3) {
              Theme.drawTakeawayPill(ctx, 'DRAM Access & Simple Dynamic Strings (SDS) Guarantee Sub-Microsecond O(1) Speed', {
                variant: 'banner',
                tag: 'MEMORY ENGINE',
                border: '#34D399'
              });
            }
          }
        },

        // ====================================================================
        // SCENE 2 [STYLE B: 360° Radial Hub-and-Spoke Reactor Ring]
        // Backdrop: spotlight
        // ====================================================================
        {
          id: 'event-loop-and-epoll',
          chapter: '02. Single-Threaded Event Loop & 360° Linux epoll Reactor',
          duration: 30,
          qaTime: 16.0,
          backdrop: 'spotlight',
          transition: 'slideLeft',
          sfx: [],
          captions: [
            { start: 0.5, end: 13.5, text: 'Many wonder why Redis runs on a single execution thread. Multi-threading introduces mutex contention, lock synchronization, and expensive CPU context switches.' },
            { start: 14.5, end: 27.5, text: 'Instead, Redis employs the Linux epoll reactor pattern, monitoring thousands of client sockets concurrently and executing queued commands sequentially with zero lock overhead.' }
          ],
          initialState: () => ({
            hub: 0,
            pipeline: 0
          }),
          build(tl, s) {
            tl.to(s, { hub: 1, duration: 1.0, ease: 'power2.out' }, 0.2)
              .to(s, { pipeline: 1, duration: 0.9, ease: 'power2.out' }, 1.2);
            Camera.zoomTo(tl, s, { x: 640, y: 500, zoom: 1.18, duration: 1.4 }, 18.0);
            Camera.reset(tl, s, 26.5, 1.0);
          },
          render(ctx, { state, t }) {
            // Left/Center: 360-Degree Radial Hub-and-Spoke Reactor Topology
            Illustrations.radialHubAndSpoke(ctx, 610, 520, {
              rx: 380,
              ry: 260,
              hubRadius: 96,
              hubTitle: 'epoll_wait()',
              hubSub: '10,000+ Non-Blocking Sockets',
              hubColor: '#FACC15',
              progress: state.hub,
              timeSec: t,
              nodes: [
                { label: 'Client #1', cmd: 'SET user:1', angle: -140, color: '#38BDF8' },
                { label: 'Client #2', cmd: 'GET cart:9', angle: -180, color: '#34D399' },
                { label: 'Client #3', cmd: 'INCR hits', angle: 140, color: '#C084FC' },
                { label: 'Client #4', cmd: 'HSET prof', angle: -75, color: '#F472B6' },
                { label: 'Client #5', cmd: 'ZADD rank', angle: 75, color: '#FBBF24' },
                { label: 'Client #6', cmd: 'LPUSH job', angle: 22, color: '#60A5FA' }
              ]
            });

            // Curved Connector from Radial Reactor Hub through open corridor to Single-Thread Pipeline
            Connectors.curvedArrow(ctx, 700, 480, 1215, 295, {
              progress: state.pipeline,
              curvature: -0.18,
              color: '#FACC15',
              label: 'Ready Socket Events (O(1))'
            });

            // Right: Vertical Single-Thread Execution Pipeline
            if (state.pipeline > 0.05) {
              ctx.save();
              ctx.globalAlpha *= state.pipeline;

              // Stage 1: Sequential Event Queue
              Illustrations.pubSubTopicBox(ctx, 1220, 240, 560, 110, {
                title: '1. aeEventLoop Ready Queue (FIFO)',
                tint: 'olive',
                offsets: ['SET user:1', 'GET cart:9', 'INCR hits', 'ZADD rank'],
                activeSlot: 0,
                progress: state.pipeline
              });

              Connectors.solidArrow(ctx, 1500, 355, 1500, 415, {
                progress: state.pipeline,
                color: '#34D399'
              });

              // Stage 2: Lock-Free Single CPU Execution Core
              ctx.beginPath();
              ctx.roundRect(1220, 420, 560, 195, 14);
              ctx.fillStyle = 'rgba(6, 78, 59, 0.30)';
              ctx.fill();
              ctx.strokeStyle = '#34D399';
              ctx.lineWidth = 2.2;
              ctx.stroke();

              Icons.draw(ctx, 'cpuSilicon', 1310, 515, 86, { glowColor: '#4ADE80' });

              ctx.fillStyle = '#FFFFFF';
              ctx.font = `700 20px ${Theme.FONTS.sans}`;
              ctx.textAlign = 'left';
              ctx.fillText('2. Single Execution Thread (call())', 1380, 470);

              ctx.fillStyle = '#6EE7B7';
              ctx.font = `600 15px ${Theme.FONTS.mono}`;
              ctx.fillText('• Zero Mutex Locks or Semaphores', 1380, 508);
              ctx.fillText('• Zero Thread Context Switch Penalty', 1380, 540);
              ctx.fillText('• 100% Hot L1/L2 CPU Instruction Cache', 1380, 572);

              // Stage 3: Redis 6.0+ Threaded I/O Footnote Banner
              ctx.beginPath();
              ctx.roundRect(1220, 645, 560, 115, 12);
              ctx.fillStyle = 'rgba(15, 23, 42, 0.88)';
              ctx.fill();
              ctx.strokeStyle = '#38BDF8';
              ctx.lineWidth = 1.6;
              ctx.stroke();

              ctx.fillStyle = '#38BDF8';
              ctx.font = `700 15px ${Theme.FONTS.mono}`;
              ctx.fillText('⚡ REDIS 6.0+ THREADED I/O ENHANCEMENT', 1248, 682);
              ctx.fillStyle = '#CBD5E1';
              ctx.font = `500 14.5px ${Theme.FONTS.sans}`;
              ctx.fillText('Worker threads parallelize socket read/write parsing,', 1248, 712);
              ctx.fillText('while memory command execution stays 100% single-threaded.', 1248, 738);

              ctx.restore();
            }

            if (state.pipeline > 0.4) {
              Theme.drawTakeawayPill(ctx, 'The epoll Reactor Pattern Eliminates Thread Locking and Context Switching Overhead', {
                variant: 'pill',
                border: '#FACC15',
                bg: 'rgba(161, 98, 7, 0.28)'
              });
            }
          }
        },

        // ====================================================================
        // SCENE 3 [STYLE C: Horizontal Top-vs-Bottom "VS" Race + SkipList Tower]
        // Backdrop: isometric
        // ====================================================================
        {
          id: 'data-structures-and-rehash',
          chapter: '03. Progressive Rehashing Race vs Multi-Level SkipLists',
          duration: 30,
          qaTime: 16.0,
          backdrop: 'isometric',
          transition: 'slideLeft',
          sfx: [],
          captions: [
            { start: 0.5, end: 13.5, text: 'Redis is far more than a key-value store; it is a specialized data structure engine with memory-compact encodings like listpacks and quicklists.' },
            { start: 14.5, end: 27.5, text: 'When hash tables resize, Redis avoids global freezes through progressive rehashing, migrating small buckets incrementally during normal queries to prevent latency spikes.' }
          ],
          initialState: () => ({
            topBadges: 0,
            race: 0,
            skipList: 0
          }),
          build(tl, s) {
            tl.to(s, { topBadges: 1, duration: 0.7, ease: 'power2.out' }, 0.2)
              .to(s, { race: 1, duration: 0.9, ease: 'power2.out' }, 0.8)
              .to(s, { skipList: 1, duration: 0.9, ease: 'power2.out' }, 1.6);
            Camera.zoomTo(tl, s, { x: 560, y: 600, zoom: 1.18, duration: 1.4 }, 18.0);
            Camera.reset(tl, s, 26.5, 1.0);
          },
          render(ctx, { state }) {
            // Top Compact Memory Encodings Strip
            if (state.topBadges > 0.05) {
              const types = [
                { tag: 'STRING', bg: '#0284C7', desc: 'SDS O(1) Buffer' },
                { tag: 'LISTPACK', bg: '#10B981', desc: 'Contiguous Array' },
                { tag: 'DICT', bg: '#F59E0B', desc: 'Dual Hash Tables' },
                { tag: 'SKIPLIST', bg: '#8B5CF6', desc: '32-Level Express' },
                { tag: 'QUICKLIST', bg: '#EC4899', desc: 'Zipped LinkedList' }
              ];
              const spanW = 1600;
              const startX = (1920 - spanW) / 2;
              const stepW = spanW / types.length;

              types.forEach((item, idx) => {
                const cx = startX + idx * stepW + stepW / 2;
                Illustrations.foldedFileBadge(ctx, cx, 215, item.tag, {
                  ribbonBg: item.bg,
                  width: 86,
                  height: 98,
                  caption: item.desc,
                  progress: state.topBadges
                });
              });
            }

            // Left: Horizontal Top-vs-Bottom "VS" Execution Race
            Illustrations.horizontalLaneRace(ctx, 140, 350, 880, 470, {
              progress: state.race
            });

            // Visual Bucket Migration inside the Top & Bottom Lanes
            if (state.race > 0.4) {
              ctx.save();
              ctx.globalAlpha *= state.race;

              // Top Lane Blocked Bar
              ctx.beginPath();
              ctx.roundRect(168, 435, 824, 82, 8);
              ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
              ctx.fill();
              ctx.strokeStyle = '#EF4444';
              ctx.stroke();

              ctx.fillStyle = '#EF4444';
              ctx.fillRect(184, 455, 520, 42);
              ctx.fillStyle = '#FFFFFF';
              ctx.font = `700 15px ${Theme.FONTS.mono}`;
              ctx.textAlign = 'center';
              ctx.fillText('⛔ COPYING 100,000,000 KEYS AT ONCE (CLIENT QUERIES TIMED OUT)', 444, 481);

              // Bottom Lane Incremental ht[0] -> ht[1] buckets
              const buckets = ['b[0] ✔', 'b[1] ✔', 'b[2] ⚡', 'b[3]', 'b[4]'];
              buckets.forEach((b, i) => {
                const bx = 172 + i * 110;
                const by = 695;
                const active = i === 2;
                const done = i < 2;
                ctx.beginPath();
                ctx.roundRect(bx, by, 96, 56, 8);
                ctx.fillStyle = active ? 'rgba(250, 204, 21, 0.25)' : (done ? 'rgba(16, 185, 129, 0.22)' : 'rgba(15, 23, 42, 0.85)');
                ctx.fill();
                ctx.strokeStyle = active ? '#FACC15' : (done ? '#34D399' : '#475569');
                ctx.lineWidth = active ? 2.2 : 1.5;
                ctx.stroke();

                ctx.fillStyle = active ? '#FEF08A' : '#FFFFFF';
                ctx.font = `700 14px ${Theme.FONTS.mono}`;
                ctx.textAlign = 'center';
                ctx.fillText(b, bx + 48, by + 33);
              });

              ctx.fillStyle = '#34D399';
              ctx.font = `700 14.5px ${Theme.FONTS.mono}`;
              ctx.textAlign = 'left';
              ctx.fillText('rehashidx=2 -> ht[1] (1 bucket/op)', 735, 728);
              ctx.restore();
            }

            // Right: Open Multi-Level SkipList Hierarchy on Isometric Grid
            if (state.skipList > 0.05) {
              ctx.save();
              ctx.globalAlpha *= state.skipList;
              ctx.fillStyle = '#C084FC';
              ctx.font = `800 17px ${Theme.FONTS.mono}`;
              ctx.textAlign = 'center';
              ctx.fillText('ZSET MULTI-LEVEL SKIPLIST (O(log N) EXPRESS LANES)', 1420, 380);
              ctx.restore();

              Illustrations.bTreeHierarchy(ctx, 1420, 425, {
                root: ['L3: 100', 'L3: 500'],
                children: [
                  { keys: ['L2: 40', 'L2: 100'], active: false },
                  { keys: ['L2: 240', 'L2: 500'], active: true },
                  { keys: ['L2: 780', 'L2: 990'], active: false }
                ],
                progress: state.skipList
              });

              if (state.skipList > 0.5) {
                ctx.save();
                ctx.beginPath();
                ctx.roundRect(1080, 685, 680, 125, 12);
                ctx.fillStyle = 'rgba(15, 23, 42, 0.88)';
                ctx.fill();
                ctx.strokeStyle = '#A855F7';
                ctx.lineWidth = 1.8;
                ctx.stroke();

                ctx.fillStyle = '#FFFFFF';
                ctx.font = `700 17px ${Theme.FONTS.sans}`;
                ctx.textAlign = 'center';
                ctx.fillText('Dual Engine: Hash Table (O(1) Score) + SkipList (O(log N) Range)', 1420, 728);
                ctx.fillStyle = '#FACC15';
                ctx.font = `600 14.5px ${Theme.FONTS.mono}`;
                ctx.fillText('Simpler than B-Trees • Lock-Free Pointer Traversal • O(log N) ZRANGE', 1420, 768);
                ctx.restore();
              }
            }

            if (state.race > 0.4) {
              Theme.drawTakeawayPill(ctx, 'Progressive Rehashing and Multi-Level SkipLists Guarantee Zero Stop-The-World Freezes', {
                variant: 'terminal'
              });
            }
          }
        },

        // ====================================================================
        // SCENE 4 [STYLE D: Horizontal User-Space / Kernel-Space Strata Diagram]
        // Backdrop: splitHorizontal
        // ====================================================================
        {
          id: 'persistence-cow-and-aof',
          chapter: '04. User/Kernel Space Strata: RDB Copy-On-Write vs AOF',
          duration: 30,
          qaTime: 16.0,
          backdrop: 'splitHorizontal',
          transition: 'fade',
          sfx: [],
          captions: [
            { start: 0.5, end: 13.5, text: 'To survive restarts without sacrificing performance, Redis combines point-in-time RDB snapshots with continuous Append-Only File journaling.' },
            { start: 14.5, end: 27.5, text: 'RDB forks a background worker utilizing operating system Copy-On-Write, streaming memory to disk while the parent continues serving client writes uninterrupted.' }
          ],
          initialState: () => ({
            userSpace: 0,
            kernelSpace: 0,
            storage: 0
          }),
          build(tl, s) {
            tl.to(s, { userSpace: 1, duration: 0.8, ease: 'power2.out' }, 0.2)
              .to(s, { kernelSpace: 1, duration: 0.9, ease: 'power2.out' }, 1.0)
              .to(s, { storage: 1, duration: 0.9, ease: 'power2.out' }, 1.8);
            Camera.zoomTo(tl, s, { x: 960, y: 580, zoom: 1.16, duration: 1.4 }, 18.0);
            Camera.reset(tl, s, 26.5, 1.0);
          },
          render(ctx, { state }) {
            // STRATUM 1: USER SPACE (Top Half y = 160..480)
            if (state.userSpace > 0.05) {
              ctx.save();
              ctx.globalAlpha *= state.userSpace;

              ctx.fillStyle = '#38BDF8';
              ctx.font = `800 15px ${Theme.FONTS.mono}`;
              ctx.textAlign = 'left';
              ctx.fillText('STRATUM 1 // LINUX USER SPACE PROCESSES', 140, 175);

              // Parent Process Node
              ctx.beginPath();
              ctx.roundRect(140, 200, 460, 185, 14);
              ctx.fillStyle = 'rgba(153, 27, 27, 0.28)';
              ctx.fill();
              ctx.strokeStyle = '#F87171';
              ctx.lineWidth = 2.2;
              ctx.stroke();

              Icons.draw(ctx, 'redisCube', 210, 275, 58, { glowColor: '#EF4444' });
              ctx.fillStyle = '#FFFFFF';
              ctx.font = `700 20px ${Theme.FONTS.sans}`;
              ctx.fillText('Redis Parent (PID 101)', 260, 255);
              ctx.fillStyle = '#4ADE80';
              ctx.font = `600 15px ${Theme.FONTS.mono}`;
              ctx.fillText('✔ Serving 100,000 QPS Live Writes', 260, 288);
              ctx.fillStyle = '#CBD5E1';
              ctx.font = `500 14px ${Theme.FONTS.sans}`;
              ctx.fillText('Mutates Page 0x03 -> Triggers Kernel COW fault', 170, 352);

              // fork() Arrow
              Connectors.solidArrow(ctx, 600, 290, 740, 290, {
                progress: state.userSpace,
                color: '#FACC15',
                label: 'fork() (0.2ms)'
              });

              // Child Process Node
              ctx.beginPath();
              ctx.roundRect(740, 200, 460, 185, 14);
              ctx.fillStyle = 'rgba(161, 98, 7, 0.24)';
              ctx.fill();
              ctx.strokeStyle = '#FACC15';
              ctx.lineWidth = 2.2;
              ctx.stroke();

              ctx.fillStyle = '#FEF08A';
              ctx.font = `700 20px ${Theme.FONTS.sans}`;
              ctx.fillText('BGSAVE Child (PID 408)', 775, 255);
              ctx.fillStyle = '#FFFFFF';
              ctx.font = `600 15px ${Theme.FONTS.mono}`;
              ctx.fillText('Read-Only Frozen Memory View', 775, 288);
              ctx.fillStyle = '#CBD5E1';
              ctx.font = `500 14px ${Theme.FONTS.sans}`;
              ctx.fillText('Serializes point-in-time pages to dump.rdb', 775, 352);

              // Right User-Space: AOF Command Buffer
              Illustrations.pubSubTopicBox(ctx, 1260, 230, 520, 120, {
                title: 'AOF Real-Time Write Buffer (aof_buf)',
                tint: 'teal',
                offsets: ['SET k1 v1', 'INCR hits', 'HSET u9', 'FLUSH'],
                activeSlot: 3,
                progress: state.userSpace
              });

              ctx.restore();
            }

            // KERNEL BOUNDARY LINE Across 1920px Canvas (y = 435)
            ctx.save();
            ctx.strokeStyle = '#FACC15';
            ctx.lineWidth = 2;
            ctx.setLineDash([12, 8]);
            ctx.beginPath();
            ctx.moveTo(100, 435);
            ctx.lineTo(1820, 435);
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.beginPath();
            ctx.roundRect(660, 415, 600, 40, 20);
            ctx.fillStyle = '#1E293B';
            ctx.fill();
            ctx.strokeStyle = '#FACC15';
            ctx.lineWidth = 1.8;
            ctx.stroke();

            ctx.fillStyle = '#FEF08A';
            ctx.font = `800 14px ${Theme.FONTS.mono}`;
            ctx.textAlign = 'center';
            ctx.fillText('▲ USER SPACE   |   ▼ LINUX KERNEL MMU & COPY-ON-WRITE RAM', 960, 440);
            ctx.restore();

            // STRATUM 2: KERNEL PHYSICAL RAM PAGES & NVMe STORAGE (y = 490..860)
            if (state.kernelSpace > 0.05) {
              ctx.save();
              ctx.globalAlpha *= state.kernelSpace;

              const pages = [
                { id: '4KB Page 0x01', state: 'Shared Read-Only', color: '#38BDF8', cow: false },
                { id: '4KB Page 0x02', state: 'Shared Read-Only', color: '#38BDF8', cow: false },
                { id: '4KB Page 0x03', state: 'Original (Child)', color: '#34D399', cow: false },
                { id: '4KB Page 0x03_COW', state: 'Mutated Copy ⚡', color: '#FACC15', cow: true }
              ];

              pages.forEach((pg, i) => {
                const px = 140 + i * 272;
                const py = 505;
                ctx.beginPath();
                ctx.roundRect(px, py, 252, 95, 10);
                ctx.fillStyle = pg.cow ? 'rgba(250, 204, 21, 0.22)' : 'rgba(15, 23, 42, 0.9)';
                ctx.fill();
                ctx.strokeStyle = pg.color;
                ctx.lineWidth = pg.cow ? 2.5 : 1.8;
                ctx.stroke();

                ctx.fillStyle = '#FFFFFF';
                ctx.font = `700 16px ${Theme.FONTS.mono}`;
                ctx.textAlign = 'center';
                ctx.fillText(pg.id, px + 126, py + 38);

                ctx.fillStyle = pg.color;
                ctx.font = `600 13.5px ${Theme.FONTS.mono}`;
                ctx.fillText(pg.state, px + 126, py + 68);
              });

              ctx.restore();
            }

            // Bottom Storage Targets
            if (state.storage > 0.05) {
              ctx.save();
              ctx.globalAlpha *= state.storage;

              // RDB Binary Snapshot Badge
              ctx.beginPath();
              ctx.roundRect(140, 645, 1060, 175, 14);
              ctx.fillStyle = 'rgba(6, 78, 59, 0.25)';
              ctx.fill();
              ctx.strokeStyle = '#34D399';
              ctx.lineWidth = 2;
              ctx.stroke();

              Illustrations.foldedFileBadge(ctx, 250, 732, 'RDB', {
                ribbonBg: '#10B981',
                width: 82,
                height: 94,
