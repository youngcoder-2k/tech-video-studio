<!DOCTYPE html>

  <style>

<body>
  <canvas id="canvas" width="1920" height="1080"></canvas>
  <script>
    const { Theme, Connectors, Icons, Illustrations, createVideo } = window.TechVideoStudio;

    createVideo({
      title: 'How Redis Actually Works Under the Hood',
      palette: 'byteCharcoal',
      fps: 30,
      showCaptions: false,
      scenes: [
        // ====================================================================
        // SCENE 1: Hardware Latency Pyramid (Beat A) -> SDS Memory Tape (Beat B)
        // ====================================================================
        {
          id: 'in-memory-and-sds',
          chapter: '01. Hardware Latency Hierarchy & Simple Dynamic Strings',
          duration: 30,
          qaTime: 6.0,
          backdrop: 'dotMatrix',
          transition: 'fade',
          sfx: [],
          captions: [
            {
              start: 0.2,
              end: 14.2,
              text: 'Why is Redis so insanely fast? Well, it comes down to physical hardware. While a fast NVMe drive takes ten thousand nanoseconds to read a page, DRAM responds in just one hundred nanoseconds. That is a one-hundred-X speed advantage.'
            },
            {
              start: 14.8,
              end: 29.0,
              text: 'Under the hood, Redis replaces standard C strings with Simple Dynamic Strings. By storing the byte length right in a compact header, checking string length becomes an instant O of 1 lookup, with zero buffer-overflow risk.'
            }
          ],
          render(ctx, { localT }) {
            // BEAT 1A (0s -> 14.6s): Single Centered 3D Hardware Latency Pyramid
            Theme.withBeat(ctx, localT, 0, 14.6, ({ progress }) => {
              ctx.fillStyle = '#94A3B8';
              ctx.font = `700 17px ${Theme.FONTS.mono}`;
              ctx.textAlign = 'center';
              ctx.fillText('PHYSICAL STORAGE HIERARCHY // LATENCY COMPARISON', 960, 185);

              Illustrations.memoryHierarchyPyramid(ctx, 960, 505, {
                width: 680,
                height: 500,
                progress
              });

              Theme.drawTakeawayPill(ctx, 'DRAM Responds in 100 Nanoseconds — 100x Faster Than NVMe Flash SSDs', {
                variant: 'banner',
                tag: '100x SPEEDUP',
                border: '#34D399'
              });
            });

            // BEAT 1B (14.6s -> 30.0s): Single Centered SDS Contiguous Memory Tape
            Theme.withBeat(ctx, localT, 14.6, 30.0, ({ progress }) => {
              Illustrations.byteArrayTape(ctx, 260, 330, 1400, 115, {
                title: 'Simple Dynamic String (struct sdshdr32) — Contiguous Memory Layout',
                progress,
                brackets: [
                  { startRatio: 0.0, endRatio: 0.37, label: '9-Byte Header (O(1) Metadata)', color: '#FACC15' },
                  { startRatio: 0.37, endRatio: 0.82, label: 'Binary-Safe Payload ("REDIS")', color: '#38BDF8' },
                  { startRatio: 0.82, endRatio: 1.0, label: 'Pre-Allocated Free Space', color: '#4ADE80' }
                ]
              });

              // 3 Clean Minimalist Feature Pills Below (No text walls!)
              const pills = [
                { title: 'O(1) Length Lookup', sub: 'Reads len field directly', color: '#FACC15', x: 260 },
                { title: '100% Binary Safe', sub: 'Stores raw bytes & images', color: '#38BDF8', x: 750 },
                { title: 'Zero Realloc Penalty', sub: 'Spare buffer absorbs appends', color: '#34D399', x: 1240 }
              ];

              pills.forEach((p) => {
                ctx.beginPath();
                ctx.roundRect(p.x, 540, 420, 130, 14);
                ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
                ctx.fill();
                ctx.strokeStyle = p.color;
                ctx.lineWidth = 2.2;
                ctx.stroke();

                ctx.fillStyle = '#FFFFFF';
                ctx.font = `700 22px ${Theme.FONTS.sans}`;
                ctx.textAlign = 'center';
                ctx.fillText(p.title, p.x + 210, 595);

                ctx.fillStyle = p.color;
                ctx.font = `600 16px ${Theme.FONTS.mono}`;
                ctx.fillText(p.sub, p.x + 210, 635);
              });

              Theme.drawTakeawayPill(ctx, 'SDS Headers Enable O(1) String Length Checks and Binary-Safe Buffers', {
                variant: 'banner',
                tag: 'SDS ENGINE',
                border: '#38BDF8'
              });
            }, { noFadeOut: true });
          }
        },

        // ====================================================================
        // SCENE 2: 360° epoll Reactor Ring (Beat A) -> Single-Thread CPU Core (Beat B)
        // ====================================================================
        {
          id: 'event-loop-and-epoll',
          chapter: '02. Linux epoll Multiplexing & Lock-Free Single Thread',
          duration: 30,
          qaTime: 6.0,
          backdrop: 'spotlight',
          transition: 'fade',
          sfx: [],
          captions: [
            {
              start: 0.2,
              end: 14.2,
              text: 'Wait... if Redis uses a single thread, how does it handle ten thousand clients at once? The secret is Linux e-poll I-O multiplexing. A single reactor monitors thousands of non-blocking sockets and wakes up only when data arrives.'
            },
            {
              start: 14.8,
              end: 29.0,
              text: 'Ready commands line up in a simple in-memory queue and execute one by one on a single CPU core. With zero mutex locks and zero thread context switches, the CPU cache stays scorching hot.'
            }
          ],
          render(ctx, { localT, t }) {
            // BEAT 2A (0s -> 14.6s): Single Centered 360° Radial epoll Reactor Ring
            Theme.withBeat(ctx, localT, 0, 14.6, ({ progress }) => {
              Illustrations.radialHubAndSpoke(ctx, 960, 505, {
                rx: 490,
                ry: 280,
                hubRadius: 112,
                hubTitle: 'epoll_wait()',
                hubSub: '10,000+ Sockets in O(1)',
                hubColor: '#FACC15',
                progress,
                timeSec: t
              });

              Theme.drawTakeawayPill(ctx, 'Linux epoll Monitors 10,000+ Concurrent Client Sockets Without Blocking Threads', {
                variant: 'pill',
                border: '#FACC15',
                bg: 'rgba(161, 98, 7, 0.28)'
              });
            });

            // BEAT 2B (14.6s -> 30.0s): Single Centered Horizontal Execution Pipeline
            Theme.withBeat(ctx, localT, 14.6, 30.0, ({ progress }) => {
              // Left Node: Ready Event FIFO Queue
              Illustrations.pubSubTopicBox(ctx, 220, 415, 580, 140, {
                title: '1. aeEventLoop Ready Queue (FIFO)',
                tint: 'olive',
                offsets: ['SET k1', 'GET u9', 'INCR v', 'ZADD r'],
                activeSlot: 0,
                progress
              });

              // Center Arrow
              Connectors.solidArrow(ctx, 815, 485, 1065, 485, {
                progress,
                color: '#FACC15',
                label: 'Sequential Dispatch'
              });

              // Right Node: Single CPU Execution Core
              ctx.beginPath();
              ctx.roundRect(1080, 355, 620, 260, 18);
              ctx.fillStyle = 'rgba(6, 78, 59, 0.32)';
              ctx.fill();
              ctx.strokeStyle = '#34D399';
              ctx.lineWidth = 2.6;
              ctx.stroke();

              Icons.draw(ctx, 'cpuSilicon', 1210, 485, 115, { glowColor: '#4ADE80' });

              ctx.fillStyle = '#FFFFFF';
              ctx.font = `700 26px ${Theme.FONTS.sans}`;
              ctx.textAlign = 'left';
              ctx.fillText('Single Execution Thread', 1310, 445);

              ctx.fillStyle = '#6EE7B7';
              ctx.font = `600 18px ${Theme.FONTS.mono}`;
              ctx.fillText('✔ Zero Mutex Lock Contention', 1310, 495);
              ctx.fillText('✔ Zero Context Switch Overhead', 1310, 535);
              ctx.fillText('✔ 100% Hot L1/L2 CPU Cache', 1310, 575);

              Theme.drawTakeawayPill(ctx, 'Single-Threaded Execution Eliminates Mutex Locks and CPU Context Switches', {
                variant: 'banner',
                tag: 'LOCK-FREE CPU',
                border: '#34D399'
              });
            }, { noFadeOut: true });
          }
        },

        // ====================================================================
        // SCENE 3: Progressive Rehashing Race (Beat A) -> ZSET SkipList (Beat B)
        // ====================================================================
        {
          id: 'data-structures-and-rehash',
          chapter: '03. Progressive Rehashing vs Multi-Level SkipLists',
          duration: 30,
          qaTime: 6.0,
          backdrop: 'isometric',
          transition: 'fade',
          sfx: [],
          captions: [
            {
              start: 0.2,
              end: 14.2,
              text: 'What happens when a hash table grows to a hundred million keys? A normal database freezes everything to copy the entire table. Redis avoids this using progressive rehashing, moving just one bucket per query so traffic never stops.'
            },
            {
              start: 14.8,
              end: 29.0,
              text: 'And for real-time leaderboards, Sorted Sets combine a hash table with a multi-level SkipList. Express pointers jump across nodes like a highway, finding any rank in O log N time.'
            }
          ],
          render(ctx, { localT }) {
            // BEAT 3A (0s -> 14.6s): Single Centered Top-vs-Bottom "VS" Execution Race
            Theme.withBeat(ctx, localT, 0, 14.6, ({ progress }) => {
              Illustrations.horizontalLaneRace(ctx, 260, 230, 1400, 560, {
                progress
              });

              // Visual bars inside the two race lanes
              ctx.beginPath();
              ctx.roundRect(300, 330, 1320, 92, 10);
              ctx.fillStyle = 'rgba(15, 23, 42, 0.92)';
              ctx.fill();
              ctx.strokeStyle = '#EF4444';
              ctx.stroke();

              ctx.fillStyle = '#EF4444';
              ctx.fillRect(320, 350, 880, 52);
              ctx.fillStyle = '#FFFFFF';
              ctx.font = `700 18px ${Theme.FONTS.mono}`;
              ctx.textAlign = 'center';
              ctx.fillText('⛔ COPYING 100M KEYS ALL AT ONCE — ALL CLIENT REQUESTS BLOCKED', 760, 383);

              // Bottom Lane Incremental Buckets
              const buckets = ['bucket[0] ✔', 'bucket[1] ✔', 'bucket[2] ⚡', 'bucket[3]', 'bucket[4]'];
              buckets.forEach((b, i) => {
                const bx = 300 + i * 210;
                const by = 640;
                const active = i === 2;
                const done = i < 2;
                ctx.beginPath();
                ctx.roundRect(bx, by, 185, 76, 10);
                ctx.fillStyle = active ? 'rgba(250, 204, 21, 0.28)' : (done ? 'rgba(16, 185, 129, 0.25)' : 'rgba(15, 23, 42, 0.88)');
                ctx.fill();
                ctx.strokeStyle = active ? '#FACC15' : (done ? '#34D399' : '#475569');
                ctx.lineWidth = active ? 2.5 : 1.6;
                ctx.stroke();

                ctx.fillStyle = active ? '#FEF08A' : '#FFFFFF';
                ctx.font = `700 18px ${Theme.FONTS.mono}`;
                ctx.textAlign = 'center';
                ctx.fillText(b, bx + 92, by + 45);
              });

              ctx.fillStyle = '#34D399';
              ctx.font = `700 18px ${Theme.FONTS.mono}`;
              ctx.textAlign = 'left';
              ctx.fillText('-> ht[1] (1 bucket / query)', 1365, 685);

              Theme.drawTakeawayPill(ctx, 'Progressive Rehashing Migrates One Bucket Per Query for Zero Latency Spikes', {
                variant: 'terminal'
              });
            });

            // BEAT 3B (14.6s -> 30.0s): Single Centered ZSET Multi-Level SkipList Tower
            Theme.withBeat(ctx, localT, 14.6, 30.0, ({ progress }) => {
              ctx.fillStyle = '#C084FC';
              ctx.font = `800 20px ${Theme.FONTS.mono}`;
              ctx.textAlign = 'center';
              ctx.fillText('SORTED SET (ZSET) // MULTI-LEVEL SKIPLIST EXPRESS LANES', 960, 220);

              Illustrations.bTreeHierarchy(ctx, 960, 290, {
                root: ['L3 Express: 100', 'L3 Express: 500'],
                children: [
                  { keys: ['L2: 40', 'L2: 100'], active: false },
                  { keys: ['L2: 240', 'L2: 500'], active: true },
                  { keys: ['L2: 780', 'L2: 990'], active: false }
                ],
                spacing: 340,
                progress
              });

              // Single Clean Dual-Structure Callout Card Below
              ctx.beginPath();
              ctx.roundRect(440, 610, 1040, 140, 16);
              ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
              ctx.fill();
              ctx.strokeStyle = '#A855F7';
              ctx.lineWidth = 2.2;
              ctx.stroke();

              ctx.fillStyle = '#FFFFFF';
              ctx.font = `700 24px ${Theme.FONTS.sans}`;
              ctx.textAlign = 'center';
              ctx.fillText('Hash Table (O(1) Point Score)  +  SkipList (O(log N) Range Scan)', 960, 668);

              ctx.fillStyle = '#FACC15';
              ctx.font = `600 17px ${Theme.FONTS.mono}`;
              ctx.fillText('Powers Real-Time Gaming Leaderboards & ZRANGEBYSCORE in Microseconds', 960, 712);

              Theme.drawTakeawayPill(ctx, 'Multi-Level SkipLists Deliver O(log N) Range Queries Without B-Tree Rebalancing', {
                variant: 'pill',
                border: '#C084FC',
                bg: 'rgba(107, 33, 168, 0.28)'
              });
            }, { noFadeOut: true });
          }
        },

        // ====================================================================
        // SCENE 4: Copy-On-Write fork() Strata (Beat A) -> RDB & AOF Disk (Beat B)
        // ====================================================================
        {
          id: 'persistence-cow-and-aof',
          chapter: '04. OS Copy-On-Write Snapshots & AOF Journaling',
          duration: 30,
          qaTime: 6.0,
          backdrop: 'splitHorizontal',
          transition: 'fade',
          sfx: [],
          captions: [
            {
              start: 0.2,
              end: 14.2,
              text: 'How do you back up fifty gigabytes of RAM to disk without pausing the server? Redis calls Linux fork to spawn a child process. Thanks to kernel Copy-On-Write, both processes share the exact same RAM pages, duplicating only the four-kilobyte pages that change.'
            },
            {
              start: 14.8,
              end: 29.0,
              text: 'While RDB writes compact binary snapshots, the Append-Only File logs every write command and flushes to disk every second. Pairing both gives you instant crash recovery with at most one second of data loss.'
            }
          ],
          render(ctx, { localT }) {
            // BEAT 4A (0s -> 14.6s): Single Centered User/Kernel Copy-On-Write Strata
            Theme.withBeat(ctx, localT, 0, 14.6, ({ progress }) => {
              // Top Stratum: Parent & Forked Child
              ctx.beginPath();
              ctx.roundRect(260, 210, 560, 180, 16);
              ctx.fillStyle = 'rgba(153, 27, 27, 0.30)';
              ctx.fill();
              ctx.strokeStyle = '#F87171';
              ctx.lineWidth = 2.4;
              ctx.stroke();

              Icons.draw(ctx, 'redisCube', 350, 300, 74, { glowColor: '#EF4444' });
              ctx.fillStyle = '#FFFFFF';
              ctx.font = `700 24px ${Theme.FONTS.sans}`;
              ctx.textAlign = 'left';
              ctx.fillText('Redis Parent (Live Traffic)', 420, 285);
              ctx.fillStyle = '#4ADE80';
              ctx.font = `600 17px ${Theme.FONTS.mono}`;
              ctx.fillText('✔ 100,000 QPS Uninterrupted', 420, 325);

              Connectors.solidArrow(ctx, 830, 300, 1090, 300, {
                progress,
                color: '#FACC15',
                label: 'fork() Syscall (0.2ms)'
              });

              ctx.beginPath();
              ctx.roundRect(1100, 210, 560, 180, 16);
              ctx.fillStyle = 'rgba(161, 98, 7, 0.28)';
              ctx.fill();
              ctx.strokeStyle = '#FACC15';
              ctx.lineWidth = 2.4;
              ctx.stroke();

              ctx.fillStyle = '#FEF08A';
              ctx.font = `700 24px ${Theme.FONTS.sans}`;
              ctx.textAlign = 'center';
              ctx.fillText('BGSAVE Child Process', 1380, 285);
              ctx.fillStyle = '#FFFFFF';
              ctx.font = `600 17px ${Theme.FONTS.mono}`;
              ctx.fillText('Frozen Point-in-Time Page Table', 1380, 325);

              // Kernel Divider Line
              ctx.strokeStyle = '#FACC15';
              ctx.lineWidth = 2;
              ctx.setLineDash([12, 8]);
              ctx.beginPath();
              ctx.moveTo(200, 465);
              ctx.lineTo(1720, 465);
              ctx.stroke();
              ctx.setLineDash([]);

              ctx.beginPath();
              ctx.roundRect(630, 443, 660, 44, 22);
              ctx.fillStyle = '#0F172A';
              ctx.fill();
              ctx.strokeStyle = '#FACC15';
              ctx.stroke();
              ctx.fillStyle = '#FEF08A';
              ctx.font = `800 15px ${Theme.FONTS.mono}`;
              ctx.textAlign = 'center';
              ctx.fillText('▲ USER SPACE   |   ▼ LINUX KERNEL COPY-ON-WRITE RAM PAGES', 960, 470);

              // Bottom Stratum: 4 Physical 4KB RAM Pages
              const pages = [
                { id: '4KB Page 0x01', sub: 'Shared Read-Only', color: '#38BDF8', cow: false },
                { id: '4KB Page 0x02', sub: 'Shared Read-Only', color: '#38BDF8', cow: false },
                { id: '4KB Page 0x03', sub: 'Child Snapshot View', color: '#34D399', cow: false },
                { id: '4KB Page 0x03_COW', sub: 'Parent Write Copy ⚡', color: '#FACC15', cow: true }
              ];

              pages.forEach((p, i) => {
                const px = 260 + i * 360;
                const py = 555;
                ctx.beginPath();
                ctx.roundRect(px, py, 320, 140, 14);
                ctx.fillStyle = p.cow ? 'rgba(250, 204, 21, 0.25)' : 'rgba(15, 23, 42, 0.9)';
                ctx.fill();
                ctx.strokeStyle = p.color;
                ctx.lineWidth = p.cow ? 2.8 : 2;
                ctx.stroke();

                ctx.fillStyle = '#FFFFFF';
                ctx.font = `700 20px ${Theme.FONTS.mono}`;
                ctx.textAlign = 'center';
                ctx.fillText(p.id, px + 160, py + 60);

                ctx.fillStyle = p.color;
                ctx.font = `600 16px ${Theme.FONTS.mono}`;
                ctx.fillText(p.sub, px + 160, py + 98);
              });

              Theme.drawTakeawayPill(ctx, 'OS Copy-On-Write Shares Physical RAM Pages — Only Modified 4KB Pages Are Copied', {
                variant: 'banner',
                tag: 'KERNEL COW',
                border: '#FACC15'
              });
            });

            // BEAT 4B (14.6s -> 30.0s): Single Centered RDB Snapshot + AOF Journal Comparison
            Theme.withBeat(ctx, localT, 14.6, 30.0, ({ progress }) => {
              // Left Card: RDB Binary Snapshot
              ctx.beginPath();
              ctx.roundRect(240, 250, 660, 490, 18);
              ctx.fillStyle = 'rgba(6, 78, 59, 0.26)';
              ctx.fill();
              ctx.strokeStyle = '#34D399';
              ctx.lineWidth = 2.4;
              ctx.stroke();

              Illustrations.foldedFileBadge(ctx, 570, 395, 'RDB', {
                ribbonBg: '#10B981',
                width: 110,
                height: 128,
                caption: 'dump.rdb (Compact Binary)',
                progress
              });

              ctx.fillStyle = '#FFFFFF';
              ctx.font = `700 26px ${Theme.FONTS.sans}`;
              ctx.textAlign = 'center';
              ctx.fillText('Point-in-Time RDB Snapshot', 570, 595);
              ctx.fillStyle = '#6EE7B7';
              ctx.font = `600 18px ${Theme.FONTS.mono}`;
              ctx.fillText('Fastest Boot Recovery & Offsite Backups', 570, 645);

              // Right Card: AOF Write Journal
              ctx.beginPath();
              ctx.roundRect(1020, 250, 660, 490, 18);
              ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
              ctx.fill();
              ctx.strokeStyle = '#38BDF8';
              ctx.lineWidth = 2.4;
              ctx.stroke();

              Illustrations.wireframeCylinderDb(ctx, 1350, 410, {
                width: 170,
                height: 150,
                color: '#38BDF8',
                label: 'appendonly.aof (fsync: everysec)',
                progress
              });

              ctx.fillStyle = '#FFFFFF';
              ctx.font = `700 26px ${Theme.FONTS.sans}`;
              ctx.textAlign = 'center';
              ctx.fillText('Append-Only Command Journal', 1350, 595);
              ctx.fillStyle = '#38BDF8';
              ctx.font = `600 18px ${Theme.FONTS.mono}`;
              ctx.fillText('Max 1s Data Loss + Auto BGREWRITEAOF', 1350, 645);

              Theme.drawTakeawayPill(ctx, 'RDB Snapshots + AOF Everysec Journaling Guarantee Fast Recovery and Durability', {
                variant: 'banner',
                tag: 'HYBRID STORAGE',
                border: '#38BDF8'
              });
            }, { noFadeOut: true });
          }
        },

        // ====================================================================
        // SCENE 5: Sentinel Quorum Triangle (Beat A) -> 16,384 Hash-Slot Ring (Beat B)
        // ====================================================================
        {
          id: 'sentinel-and-cluster-slots',
          chapter: '05. Sentinel Quorum Failover & 16,384 Hash-Slot Ring',
          duration: 30,
          qaTime: 22.0,
          backdrop: 'blueprint',
          transition: 'fade',
          sfx: [],
          captions: [
            {
              start: 0.2,
              end: 14.2,
              text: 'What if the master server crashes at three A-M? Redis Sentinel runs a triangle of quorum watchers sending constant heartbeats. Once two Sentinels confirm the master is down, they elect a leader and promote a replica automatically.'
            },
            {
              start: 14.8,
              end: 29.0,
              text: 'To scale beyond a single machine\'s RAM, Redis Cluster splits the keyspace into sixteen thousand three hundred eighty-four hash slots. Smart clients hash each key with C-R-C sixteen and route requests straight to the owning shard.'
            }
          ],
          render(ctx, { localT, t }) {
            // BEAT 5A (0s -> 14.6s): Single Centered Triangular Sentinel Quorum Mesh
            Theme.withBeat(ctx, localT, 0, 14.6, ({ progress }) => {
              ctx.fillStyle = '#FACC15';
              ctx.font = `800 19px ${Theme.FONTS.mono}`;
              ctx.textAlign = 'center';
              ctx.fillText('REDIS SENTINEL // 3-NODE QUORUM CONSENSUS & AUTO-FAILOVER', 960, 195);

              Illustrations.quorumTriangleMesh(ctx, 960, 415, {
                radius: 175,
                progress,
                timeSec: t
              });

              // Failover Promotion Pair Centered Below Triangle
              ctx.beginPath();
              ctx.roundRect(450, 645, 420, 110, 14);
              ctx.fillStyle = 'rgba(127, 29, 29, 0.30)';
              ctx.fill();
              ctx.strokeStyle = '#EF4444';
              ctx.lineWidth = 2.2;
              ctx.stroke();

              ctx.fillStyle = '#FCA5A5';
              ctx.font = `800 20px ${Theme.FONTS.mono}`;
              ctx.textAlign = 'center';
              ctx.fillText('Master 6379 (ODOWN ❌)', 660, 708);

              Connectors.solidArrow(ctx, 880, 700, 1040, 700, {
                progress,
                color: '#34D399',
                label: 'Auto-Promote (<2s)'
              });

              ctx.beginPath();
              ctx.roundRect(1050, 645, 420, 110, 14);
              ctx.fillStyle = 'rgba(6, 78, 59, 0.34)';
              ctx.fill();
              ctx.strokeStyle = '#34D399';
              ctx.lineWidth = 2.4;
              ctx.stroke();

              ctx.fillStyle = '#6EE7B7';
              ctx.font = `800 20px ${Theme.FONTS.mono}`;
              ctx.textAlign = 'center';
              ctx.fillText('Replica -> NEW MASTER ✔', 1260, 708);

              Theme.drawTakeawayPill(ctx, 'Sentinel Quorum Consensus Detects Node Failures and Promotes Replicas Automatically', {
                variant: 'pill',
                border: '#FACC15',
                bg: 'rgba(161, 98, 7, 0.28)'
              });
            });

            // BEAT 5B (14.6s -> 30.0s): Single Giant Centered 360° 16,384 Hash-Slot Ring
            Theme.withBeat(ctx, localT, 14.6, 30.0, ({ progress }) => {
              ctx.fillStyle = '#38BDF8';
              ctx.font = `800 19px ${Theme.FONTS.mono}`;
              ctx.textAlign = 'center';
              ctx.fillText('REDIS CLUSTER // 16,384 HASH SLOTS & PROXY-FREE SMART ROUTING', 960, 190);

              Illustrations.hashSlotRingCluster(ctx, 960, 520, {
                radius: 195,
                progress,
                timeSec: t
              });

              Theme.drawTakeawayPill(ctx, '16,384 Hash Slots (CRC16 % 16384) Route Queries Directly to the Owning Shard', {
                variant: 'pill',
                border: '#38BDF8'
              });
            }, { noFadeOut: true });
          }
        },

        // ====================================================================
        // SCENE 6: Sampled LRU Pool (Beat A) -> 2x2 Architect Scorecard (Beat B)
        // ====================================================================
        {
          id: 'eviction-ttl-and-gotchas',
          chapter: '06. Approximated LRU Eviction & Production Golden Rules',
          duration: 30,
          qaTime: 22.0,
          backdrop: 'waves',
          transition: 'fade',
          sfx: [],
          captions: [
            {
              start: 0.2,
              end: 14.2,
              text: 'Finally, what happens when memory fills up? Instead of maintaining a massive doubly-linked list for L-R-U, Redis randomly samples just five keys and evicts whichever one has been idle the longest, saving gigabytes of pointer overhead.'
            },
            {
              start: 14.8,
              end: 29.0,
              text: 'In production, remember two golden rules: never run synchronous delete on giant keys—use asynchronous unlink instead—and cap max-memory at seventy-five percent of physical RAM so Copy-On-Write snapshots never trigger an O-O-M kill.'
            }
          ],
          render(ctx, { localT }) {
            // BEAT 6A (0s -> 14.6s): Single Centered Approximated LRU 5-Key Sampling Pool
            Theme.withBeat(ctx, localT, 0, 14.6, ({ progress }) => {
              ctx.fillStyle = '#FACC15';
              ctx.font = `800 19px ${Theme.FONTS.mono}`;
              ctx.textAlign = 'center';
              ctx.fillText('APPROXIMATED LRU EVICTION // 5-KEY RANDOM SAMPLING (ZERO LINKED-LIST RAM)', 960, 200);

              // Centered RAM Capacity Bar
              ctx.beginPath();
              ctx.roundRect(460, 235, 1000, 64, 14);
              ctx.fillStyle = '#111827';
              ctx.fill();
              ctx.strokeStyle = '#EF4444';
              ctx.lineWidth = 2.2;
              ctx.stroke();

              const barGrad = ctx.createLinearGradient(472, 0, 1440, 0);
              barGrad.addColorStop(0, '#10B981');
              barGrad.addColorStop(0.65, '#FACC15');
              barGrad.addColorStop(1, '#EF4444');
              ctx.beginPath();
              ctx.roundRect(472, 247, 976 * progress, 40, 8);
              ctx.fillStyle = barGrad;
              ctx.fill();

              ctx.fillStyle = '#090D16';
              ctx.font = `800 17px ${Theme.FONTS.mono}`;
              ctx.textAlign = 'center';
              ctx.fillText('RAM CAPACITY AT 99.4% -> SAMPLE 5 KEYS & EVICT OLDEST', 960, 273);

              const candidates = [
                { key: 'session:9812', clock: '24-bit idle clock: 120s', status: 'RETAINED ✔', evict: false },
                { key: 'profile:4401', clock: '24-bit idle clock: 840s', status: 'RETAINED ✔', evict: false },
                { key: 'catalog:1029', clock: '24-bit idle clock: 4,200s (OLDEST)', status: 'EVICTED ⚡', evict: true },
                { key: 'cart:7731', clock: '24-bit idle clock: 30s', status: 'RETAINED ✔', evict: false },
                { key: 'token:5590', clock: '24-bit idle clock: 520s', status: 'RETAINED ✔', evict: false }
              ];

              candidates.forEach((c, i) => {
                const cy = 335 + i * 86;
                const cx = c.evict ? 495 : 460;
                ctx.beginPath();
                ctx.roundRect(cx, cy, 1000, 70, 12);
                ctx.fillStyle = c.evict ? 'rgba(153, 27, 27, 0.40)' : 'rgba(15, 23, 42, 0.9)';
                ctx.fill();
                ctx.strokeStyle = c.evict ? '#EF4444' : '#334155';
                ctx.lineWidth = c.evict ? 2.8 : 1.8;
                ctx.stroke();

                ctx.fillStyle = c.evict ? '#FCA5A5' : '#38BDF8';
                ctx.font = `700 20px ${Theme.FONTS.mono}`;
                ctx.textAlign = 'left';
                ctx.fillText(c.key, cx + 32, cy + 42);

                ctx.fillStyle = c.evict ? '#FEF08A' : '#94A3B8';
                ctx.font = `600 17px ${Theme.FONTS.mono}`;
                ctx.fillText(c.clock, cx + 310, cy + 42);

                ctx.fillStyle = c.evict ? '#EF4444' : '#34D399';
                ctx.font = `800 18px ${Theme.FONTS.mono}`;
                ctx.textAlign = 'right';
                ctx.fillText(c.status, cx + 968, cy + 42);
              });

              Theme.drawTakeawayPill(ctx, 'Sampled 24-Bit LRU Evicts Cold Keys Without Linked-List Memory Overhead', {
                variant: 'banner',
                tag: 'SAMPLED LRU',
                border: '#F87171'
              });
            });

            // BEAT 6B (14.6s -> 30.0s): Single Centered 2x2 Architect Do's & Don'ts Scorecard
            Theme.withBeat(ctx, localT, 14.6, 30.0, ({ progress }) => {
              ctx.fillStyle = '#34D399';
              ctx.font = `800 19px ${Theme.FONTS.mono}`;
              ctx.textAlign = 'center';
              ctx.fillText('PRODUCTION REDIS ARCHITECTURE // GOLDEN DO\'S & DON\'TS SCORECARD', 960, 200);

              Illustrations.scorecardMatrix(ctx, 360, 240, 1200, 580, {
                progress
              });

              Theme.drawTakeawayPill(ctx, 'Use Async UNLINK for Big Keys and Cap maxmemory at 75% RAM for COW Headroom', {
                variant: 'terminal'
              });
            }, { noFadeOut: true });
          }
        }
      ]
    });
  </script>
